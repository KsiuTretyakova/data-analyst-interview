["Can you run several tests at once?","Yes, if they're independent — randomization «mixes» the effects. If they touch the same part of the product and may interact — split layers/audiences or run sequentially."],
["5 features to test. Which first?","Prioritize: expected impact × confidence / effort (ICE, RICE). Plus how much traffic and time each needs."],
["What matters most in an A/B test?","A clear hypothesis and the right metric, correct randomization, enough sample, and discipline (no peeking)."],
["Why does ethics matter?","A test affects real people.","Testing manipulative «dark patterns» in subscriptions or different prices for vulnerable groups."],
["Minimum test duration?","Usually at least 1 full week (better 2) to cover weekly seasonality, even if the sample is reached earlier."],
["A/B test vs gradual rollout to everyone?","An A/B test has a control group at the same time — the effect is separated from seasonality/marketing. With a full rollout you compare «before/after», and any external event distorts the result."],
["What is the peeking problem and how to avoid it?","Checking results regularly and stopping at the first significance → inflated false positives. Avoid: fix sample size/duration in advance or use sequential testing."]
]},
{title:"Product metrics", intro:"Understand not only the formulas but what a metric says about the business.", qs:[
["Which product metrics do you know?","DAU/WAU/MAU, retention, churn, conversion, LTV, ARPU, ARPPU, CAC, sticky factor, average order value, session length, NPS."],
["What is a North Star metric?","The main metric that best reflects the product's value for users and links to the business.","Spotify — listening time, Airbnb — nights booked."],
["What is DAU?","Daily Active Users — unique users who did a target action in a day."],
["What types of users make up DAU?","New (first time today), returning (retained), and resurrected after a break."],
["What does «active» mean in DAU?","The team defines it: performed a meaningful action (opened the app, viewed content, made a purchase). It should reflect real value."],
["What is conversion?","The share of users who move to a target action.","Of 1,000 who opened a product page, 50 bought → 5% conversion."],
["10M downloads — why is it a vanity metric?","Downloads don't mean usage or money. Many may have deleted the app right away. Retention, active users and revenue matter more."],
["What is LTV? Over what period?","Lifetime Value — how much money a user brings over their whole time with the product. Often computed over a horizon (LTV 30/90/365 days)."],
["How is LTV calculated and what affects it?","Simplified: ARPU × average lifetime (or ARPU / churn). Also: margin, retention, price, purchase frequency."],
["What is ARPU? How is it different from LTV?","ARPU — average revenue per user for a period (month). LTV — over the whole «lifecycle»."],
["ARPU vs ARPPU? Which is larger?","ARPU — revenue per all users, ARPPU — per paying users only. ARPPU ≥ ARPU because we divide by a smaller number."],
["What is CAC?","Customer Acquisition Cost — the cost to acquire one customer (marketing spend / new customers)."],
["The LTV / CAC ratio?","Shows whether acquisition pays off. A healthy benchmark is ~3:1."],
["LTV/CAC < 1, = 1, > 1?","< 1 — losing money on every customer. = 1 — break-even (ignoring other costs). > 1 — profitable; higher is better (but very high may mean under-investing in growth)."],
["Why does a company with LTV/CAC = 3 need investment?","CAC is paid upfront, LTV comes over years. Growing fast requires money «in advance» — a cash gap."],
["Can we use ARPU instead of LTV?","Not quite: ARPU is per period and ignores how long users stay. For marketing decisions you need LTV."],
["How long to wait to compute a campaign's LTV?","Fully — until the cohort «lives out». In practice we look at early points (D7, D30) and forecast LTV from historical curves."],
["What is retention?","The share of users who return N days after their first visit.","Retention D7 = returned on day 7 / total in cohort."],
["What is churn? How to derive it from retention?","The share of users who left. Churn = 1 − retention (for the same period)."],
["Rolling vs classic retention?","Rolling — a user counts as retained if they returned on day N OR later. So rolling ≥ classic."],
["What is a cohort?","A group of users sharing a trait, usually first-visit date. Cohorts allow fair comparisons without mixing old and new users."],
["Sticky factor?","DAU / MAU — how often users return during the month."],
["Range of the sticky factor?","From ~1/30 (everyone visits once a month) to 1 (everyone daily). Messengers ~50%+."],
["Your favorite app — which metrics should its team track?","Pick an app and tie metrics to its value: Duolingo — DAU, streaks, retention, conversion to Super."],
["ChatGPT — which metrics?","DAU/WAU, conversations/messages per user, retention, conversion to Plus, subscription churn, answer quality (likes/dislikes), latency."],
["«Diia» (Ukraine's e-gov app) — which metrics?","Active users, share of successfully completed services, time to complete a service, errors/failures, satisfaction (CSAT), share of digital vs offline services."],
["The dashboard shows a conversion drop. Where do you look?","1) Check the data (tracking, ETL, dashboard). 2) Segment: platform, country, channel, version. 3) Recall releases, marketing changes, seasonality. 4) Find which funnel step dropped."],
["Installs +20%. Is that success?","Not necessarily. Check traffic quality: retention, activation, revenue from new users, and CAC."],
["DAU −10%. Hypotheses?","Tracking issue, a bug in a release, fewer new users (less ads), worse retention, seasonality/holidays, a problem on one platform or country, a competitor."],
["Trial-to-subscription activation +10%. Did profit grow?","Not necessarily: maybe more early cancellations/refunds, a changed plan, or fewer people started the trial. Look at revenue and subscriber retention."],
["What is a funnel?","A sequence of steps to a target action with conversion between steps. Shows where we lose users.","Visit → cart → payment."],
["How are hypotheses formed?","«If we do X, metric Y will change by Z, because…». Sources: data, user feedback, competitors, UX research."],
["How do you prioritize hypotheses?","ICE (Impact, Confidence, Ease) or RICE (+ Reach) frameworks. Score and sort."],
["Guardrail metrics?","«Protective» metrics that must not get worse during changes.","Conversion went up — check that churn or load time didn't."],
["What is a «metric tree»?","Decomposing the main metric into components.","Revenue = users × conversion × average order value. Helps find what exactly changed."]
]},
{title:"Python (Pandas, NumPy)", intro:"Learn Pandas, NumPy, Matplotlib/Seaborn and build a few analytics projects.", qs:[
["What are libraries? Why does an analyst need them?","Sets of ready-made code so you don't write everything from scratch: Pandas — tables, NumPy — computation, Matplotlib/Seaborn — charts, SciPy — statistics."],
["Which libraries do you use?","Pandas, NumPy, Matplotlib, Seaborn, Plotly, SciPy / statsmodels, scikit-learn."],
["In which environment have you used Python?","Jupyter Notebook / Google Colab — convenient for step-by-step analysis with charts; VS Code / PyCharm — for scripts."],
["Examples of analysis in Python?","Be specific: EDA of a dataset, cohort retention analysis, A/B test analysis, report automation."],
["Do you have Python projects?","Show GitHub/Kaggle: the task, the data, what you did, conclusions."],
["Visualization libraries and experience?","Matplotlib (basics), Seaborn (statistical charts), Plotly (interactive). Line, bar, histograms, boxplots, correlation heatmaps."],
["EDA in Python: what did you do?","<code>head()</code>, <code>info()</code>, <code>describe()</code>, <code>isnull().sum()</code>, <code>value_counts()</code>, <code>groupby()</code>, histograms, boxplots, correlations."],
["How did you remove outliers?","IQR: keep rows between Q1 − 1.5·IQR and Q3 + 1.5·IQR, or z-score.","<code>q1,q3 = df.x.quantile([.25,.75]); iqr=q3-q1; df = df[df.x.between(q1-1.5*iqr, q3+1.5*iqr)]</code>"],
["How do you import a CSV and why the delimiter?","<code>pd.read_csv('file.csv', sep=';')</code>. The delimiter is the column separator (comma, semicolon, tab). Wrong one — everything ends up in one column."],
["What is info() for?","Shows row count, column names, data types, non-null counts and memory usage."],
["How do you show the first 10 rows?","<code>df.head(10)</code>"],
["How do you show only the second column?","<code>df.iloc[:, 1]</code> (by position) or <code>df['name']</code>."],
["How do you combine two datasets?","<code>pd.merge(df1, df2, on='id', how='left')</code> — like JOIN; <code>pd.concat([df1, df2])</code> — like UNION."],
["What is dropna() for?","Drops rows (or columns with axis=1) that have missing values (NaN)."],
["How do you remove all duplicates?","<code>df.drop_duplicates()</code> (you can pass a subset of columns)."],
["What is isnull().sum() for?","Counts missing values in each column."],
["How do you sort data?","<code>df.sort_values('price', ascending=False)</code>"],
["How do you rename a column?","<code>df.rename(columns={'old': 'new'})</code>"],
["How do you change a data type?","<code>df['col'].astype(int)</code>, for messy numbers — <code>pd.to_numeric(..., errors='coerce')</code>."],
["Working with dates and times?","<code>pd.to_datetime()</code> to convert, <code>.dt.year/.dt.month/.dt.day_name()</code>, date differences, <code>resample()</code> to group by day/week."],
["What is the axis parameter for?","axis=0 — along rows (down a column), axis=1 — along columns (across a row).","<code>df.drop('col', axis=1)</code> drops a column."],
["How do you drop a column?","<code>df.drop(columns=['col'])</code>"],
["What is reset_index() for?","Resets the index to 0, 1, 2… (the old one becomes a column; <code>drop=True</code> discards it). Useful after filtering or groupby."],
["How do you export to CSV?","<code>df.to_csv('result.csv', index=False)</code>"],
["Explain: df = pd.read_csv('housing_data.csv')","Reads a CSV file into a Pandas DataFrame and stores it in df."],
["Explain: df['Price'].mean()","The mean of the Price column."],
["Explain: df['Title'] = df['Title'].str.strip()","Removes leading and trailing spaces from every value in Title and overwrites the column."],
["Explain: df['Genres'].value_counts()","Count of each unique value in Genres, most frequent first."],
["Explain: df['Date'] = pd.to_datetime(df['Date'])","Converts the Date column from text to datetime so you can filter and compute with dates."]
]},
{title:"Other questions", intro:"Questions about your thinking and level.", qs:[
["What's the largest data volume you've worked with? What did you use?","Give an honest number and tool (e.g. 2M rows in Pandas, 100 GB in BigQuery) and how you handled performance issues."],
["Another department won't give you the data you need. What do you do?","Explain why you need it and what value the analysis brings; find out the reason (access, security, workload); offer a compromise; involve your manager if needed."],
["A manager makes a decision that contradicts your analysis. What do you do?","Briefly and clearly show the data and risks again; listen to their arguments (they may have context you lack). The decision is theirs; propose metrics to check the outcome."],
["You're given SQL/Python code to improve. Your approach?","Understand the goal → run it, check the output → break down the logic → ask the author about unclear parts → make changes in small steps → verify the result and document."],
["A product has been in soft launch for a year with only basic analytics. What do you set up first?","Tracking of key events and funnels, basic metrics (DAU, retention, conversion, revenue), traffic source attribution, and a simple dashboard."],
["What is product analytics to you?","Analyzing user behavior to understand how the product creates value and helping the team decide what to improve and what to test."],
["Marketing vs product analytics?","Marketing — how to acquire users: channels, CAC, campaign ROI. Product — what happens after they arrive: activation, retention, monetization."],
["Ask a logic puzzle the interviewer can't solve","Prepare a favorite puzzle in advance. Keep it calm and light-hearted, without trying to «beat» the person."]
]}
];

const DATA_DE = [
{title:"Vorgespräch mit dem Recruiter", intro:"Hier gibt es kein Richtig oder Falsch. Wichtig sind Offenheit, konkrete Beispiele, „ich“ statt „wir“ und echte Lernbereitschaft.", qs:[
["Warum dieser Bereich? Warum hast du dich für Analytics entschieden?","Erzähle eine persönliche Geschichte: was dich begeistert (Muster finden, faktenbasierte Entscheidungen). Nenne, was du schon gemacht hast: Kurse, Pet-Projekte.","„Ich habe gesehen, wie ein Verkaufsbericht eine Teamentscheidung verändert hat, und wollte das selbst machen. Ich habe einen SQL-Kurs absolviert und 2 Dashboards gebaut.“"],
["Was gefällt dir an deinem Beruf am meisten und am wenigsten?","Plus — etwas Sinnvolles (Insights finden, Einfluss aufs Produkt). Minus — ehrlich, aber nicht jobkritisch (z. B. unsaubere Daten kosten viel Zeit — und was du dagegen tust)."],
["Beschreibe deinen idealen Arbeitstag.","Zeige, dass dich die Arbeit selbst interessiert: klare Aufgabe, Zeit für tiefe Analyse, Ergebnisse mit dem Team besprechen, etwas Neues lernen."],
["Was ist dir bei einem Arbeitgeber am wichtigsten: Entwicklung, Benefits, Gehalt, Team, Technologien?","Für Juniors ist eine starke Antwort: Entwicklung und ein Team, von dem man lernen kann. Sei ehrlich, aber begründe."],
["Was könnte dich zum Kündigen bringen?","Nenne wertebezogene Dinge: keine Entwicklung, toxisches Umfeld, Unehrlichkeit. Sag nicht „ich finde etwas, wo man mehr zahlt“."],
["Hattest du Konflikte bei der Arbeit? Wie wurden sie gelöst?","Nutze STAR: Situation → Aufgabe → Aktion → Ergebnis. Zeige, dass du Lösungen suchst, keine Schuldigen."],
["Dein Lead ist beschäftigt, du hast im ersten Monat keine Aufgaben und kein Feedback. Was tust du?","Initiative zeigen: Dokumentation, Daten, Dashboards, Produkt studieren; Kollegen fragen; selbst eine Aufgabe vorschlagen; Fragen notieren und kurz mit dem Lead abstimmen, wenn er Zeit hat."],
["Was war die schwierigste Veränderung in deiner Karriere?","Oft ist es der Quereinstieg in die IT selbst. Erzähle, was schwer war und wie du es geschafft hast."],
["Gibt es jemanden im Beruf, der dich inspiriert?","Nenne konkrete Personen, Blogs, Podcasts, Buchautoren — das zeigt, dass du im Thema bist."],
["Was inspiriert dich? Erzähl von deinen Hobbys.","Sei ehrlich. Gut, wenn das Hobby Disziplin oder Neugier zeigt (Sport, Spiele mit Statistik, Lesen)."]
]},
{title:"Logik & Fermi-Schätzung", intro:"Die Fermi-Methode ist eine schnelle Überschlagsrechnung: Eine große Frage in kleine zerlegen, die man abschätzen kann. Wichtig ist der Denkweg, nicht die exakte Zahl.", qs:[
["Wie viele Glühbirnen gibt es in Charkiw?","Zerlegen: Einwohner (~1,4 Mio.) → Haushalte (~600 Tsd.) × Lampen pro Wohnung (~10) = 6 Mio. Plus Büros, Läden, Straßen (+30–50 %). Antwort: etwa 8–10 Mio. Annahmen laut aussprechen."],
["Wie viele Menschen werden täglich weltweit geboren?","~8 Mrd. Menschen, Geburtenrate ~17 pro 1.000 pro Jahr → ~135 Mio. pro Jahr / 365 ≈ 370 Tsd. pro Tag."],
["Wie viel Sonnenblumenöl verbrauchen ukrainische Haushalte pro Jahr?","~30 Mio. Menschen × ~10 L pro Person und Jahr ≈ 300 Mio. L (≈ 270 Tsd. t). Jede Annahme erklären."],
["Ein Licht geht nach 1 Min. an, dann nach 30 s, 15 s … (Intervall halbiert sich). Wie oft geht es in 2 Minuten an?","1 + 0,5 + 0,25 + … = 2 Minuten — Summe einer unendlichen Reihe. In 2 Minuten geht das Licht also unendlich oft an (in jeder kürzeren Zeit endlich oft)."],
["Seile brennen in 30 bzw. 60 Min. ab, ungleichmäßig. Wie misst man 45 Min.?","Gleichzeitig das 30-Min.-Seil an einem Ende und das 60-Min.-Seil an einem Ende anzünden. Wenn das kurze abgebrannt ist (30 Min.), hat das lange noch 30 Min. — jetzt sein anderes Ende anzünden, es brennt in 15 Min. ab. Zusammen 45."],
["Setze fort: 82, 50, 26, … / 1, 1, 2, 3, 5, … / 1, 8, 27, 64, …","82 = 9²+1, 50 = 7²+1, 26 = 5²+1 → als Nächstes 3²+1 = <b>10</b>. Fibonacci: jede Zahl = Summe der zwei vorherigen → <b>8</b>. Kuben 1³, 2³, 3³, 4³ → <b>125</b>."],
["Schläger und Ball kosten zusammen 1,10 $. Der Schläger kostet 1 $ mehr als der Ball. Was kostet der Ball?","Nicht 0,10! Ball = x, Schläger = x + 1, zusammen 2x + 1 = 1,10 → x = <b>0,05 $</b>. Prüft, ob du „auf Autopilot“ antwortest."],
["5 Maschinen machen 5 Teile in 5 Minuten. Wie lange brauchen 100 Maschinen für 100 Teile?","Eine Maschine macht ein Teil in 5 Min. Also machen 100 Maschinen 100 Teile ebenfalls in <b>5 Minuten</b>."],
["Ein Seerosenteppich verdoppelt sich täglich und bedeckt den See in 48 Tagen. Wann ist er halb bedeckt?","An <b>Tag 47</b> — am nächsten Tag verdoppelt er sich. Eine Aufgabe zu exponentiellem Wachstum."],
["8 gleich aussehende Kugeln, eine ist schwerer. Wie viele Wägungen mit einer Balkenwaage mindestens?","<b>2</b>. 3 gegen 3: Gleichgewicht → die schwere ist unter den restlichen 2 (noch eine Wägung 1 gegen 1). Sonst die schwerere Dreiergruppe nehmen, 1 gegen 1: Gleichgewicht → es ist die dritte."],
["Du hast Eimer mit 3 L und 5 L. Wie misst du genau 4 L ab?","5 L füllen → in den 3-L-Eimer gießen (2 L bleiben im 5-L) → 3 L ausleeren → die 2 L hineingießen → 5 L füllen → den 3-L auffüllen (fehlt 1 L) → im 5-L-Eimer bleiben <b>4 L</b>."],
["Drei Schalter im Flur, eine Lampe im geschlossenen Raum. Du darfst nur einmal hinein. Wie findest du den richtigen Schalter?","Ersten Schalter einige Minuten einschalten, ausschalten, zweiten einschalten und hineingehen. Leuchtet — zweiter; aus, aber warm — erster; kalt — dritter."],
["Wie oft am Tag überdecken sich Stunden- und Minutenzeiger?","<b>22-mal</b> (nicht 24): 11-mal pro 12 Stunden, weil es zwischen 11:00 und 13:00 nur eine Überdeckung gibt (12:00)."],
["Setze die Folge fort: 2, 6, 12, 20, 30, …","Differenzen 4, 6, 8, 10 → als Nächstes 12, also <b>42</b>. Oder Formel n·(n+1): 6·7 = 42."],
["Wie viele Klavierstimmer gibt es in Kyjiw? (klassische Fermi-Frage)","~3 Mio. Einwohner → ~1,2 Mio. Haushalte; ~2 % haben ein Klavier → ~25 Tsd. + Schulen → ~30 Tsd. Klaviere. Einmal im Jahr gestimmt; ein Stimmer schafft ~2 pro Tag × 250 Tage = 500 pro Jahr → <b>~60 Stimmer</b>."],
["Wie viele Tassen Kaffee werden in der Ukraine pro Tag getrunken?","~25 Mio. Erwachsene; ~60 % trinken Kaffee; im Schnitt ~1,5 Tassen → 25 × 0,6 × 1,5 ≈ <b>22 Mio. Tassen</b> pro Tag. Die Logik zählt, nicht die genaue Zahl."]
]},
{title:"Excel / Google Sheets", intro:"Ein Basiswerkzeug. Kenne Aggregatfunktionen, Suchfunktionen (SVERWEIS/XVERWEIS), Pivot-Tabellen und Fehlerbehandlung. Funktionsnamen sind in der englischen Version angegeben.", qs:[
["Was ist der Unterschied zwischen Excel und Google Sheets?","Excel ist eine Desktop-App, stärker bei großen Daten, Power Query, VBA-Makros. Google Sheets läuft im Browser, hervorragende Echtzeit-Zusammenarbeit, Funktionen wie QUERY, IMPORTRANGE, aber langsamer bei großen Datenmengen."],
["Welche Aggregatfunktionen kennst du?","Funktionen, die viele Werte zu einem machen: SUM, AVERAGE, COUNT, COUNTA, MIN, MAX, MEDIAN sowie bedingte SUMIF(S), COUNTIF(S), AVERAGEIF(S)."],
["Mit welchen Funktionen arbeitest du?","Nenne echte: SUM/AVERAGE, IF, SUMIFS/COUNTIFS, VLOOKUP/XLOOKUP, INDEX+MATCH, IFERROR, TEXT, LEFT/RIGHT/MID, TRIM, CONCAT, Datumsfunktionen (TODAY, EOMONTH), UNIQUE, FILTER."],
["Was ist bedingte Formatierung?","Automatisches Einfärben von Zellen nach einer Regel (z. B. rot, wenn Wert < 0). Zeigt Anomalien, Trends und Spitzenwerte sofort."],
["Wofür ist VLOOKUP (XLOOKUP)?","Um einen Wert per Schlüssel in einer anderen Tabelle zu finden — Daten „heranziehen“. XLOOKUP ist neuer: sucht in jede Richtung, exakte Übereinstimmung standardmäßig, eingebaute „nicht gefunden“-Behandlung.","Den Preis eines Produkts per ID aus einer Referenztabelle holen."],
["Was ist eine Pivot-Tabelle?","Gruppiert und aggregiert Daten schnell ohne Formeln: Felder in Zeilen/Spalten/Werte ziehen — z. B. Umsatz nach Monat und Region."],
["Filtern vs. Sortieren?","Sortieren ändert die Reihenfolge der Zeilen. Filtern blendet Zeilen aus, die eine Bedingung nicht erfüllen. In beiden Fällen werden keine Daten gelöscht."],
["Wie findet und entfernt man Duplikate?","Finden — bedingte Formatierung „Doppelte Werte“ oder COUNTIF > 1. Entfernen — „Daten → Duplikate entfernen“ (Excel) / „Datenbereinigung → Duplikate entfernen“ (Sheets) oder UNIQUE."],
["Wann nutzt man IFERROR und warum ist es wichtig?","Ersetzt einen Fehler (#N/A, #DIV/0!) durch einen lesbaren Wert. Der Bericht sieht sauber aus, Summenformeln brechen nicht.","<code>=IFERROR(VLOOKUP(A2,B:C,2,0),\"nicht gefunden\")</code>"],
["Wie funktioniert TTEST?","Führt den t-Test nach Student aus und liefert den p-Wert — ob sich die Mittelwerte zweier Stichproben signifikant unterscheiden. Argumente: zwei Bereiche, Anzahl der Enden (1/2), Testtyp (gepaart, gleiche/ungleiche Varianzen)."],
["Wann nutzt man CONCAT?","Um Text aus mehreren Zellen zu verbinden: Vor- + Nachname, einen Schlüssel aus mehreren Feldern bilden."],
["Ergebnis von =MAX(A1:A10)?","Die größte Zahl im Bereich A1:A10."],
["Ergebnis von =SUMIF(A1:A10, \">50\")?","Die Summe nur der Werte in A1:A10, die größer als 50 sind."],
["Ergebnis von =IF(A1>10, \"Yes\", \"No\")?","„Yes“, wenn A1 größer als 10 ist, sonst „No“."],
["Ergebnis von =VLOOKUP(A1, B1:C10, 2, FALSE)?","Sucht A1 in der ersten Spalte des Bereichs (B) mit exakter Übereinstimmung und liefert den Wert aus der 2. Spalte (C) derselben Zeile. Nicht gefunden — #N/A."],
["Ergebnis von =INDEX(A1:C10, 5, 2)?","Der Wert aus Zeile 5, Spalte 2 des Bereichs — Zelle B5."],
["Ergebnis von =LEFT(A1, 5)?","Die ersten 5 Zeichen des Textes in A1."],
["Ergebnis von =TRIM(A1)?","Der Text aus A1 ohne führende/nachgestellte Leerzeichen und ohne doppelte Leerzeichen im Inneren."],
["Ergebnis von =CONCATENATE(A1, \" \", B1)?","Verbindet A1 und B1 mit einem Leerzeichen, z. B. „Max Müller“."],
["Wie suchst du Daten, wenn du nicht weißt, wo sie sind?","Strg+F (ganzes Blatt/Mappe durchsuchen), Filter, MATCH/XLOOKUP, FILTER oder bedingte Formatierung zum Hervorheben."],
["Wie berechnet man den Anteil an der Gesamtsumme?","Wert durch die Summe mit absolutem Bezug teilen und Prozentformat setzen.","<code>=B2/SUM($B$2:$B$100)</code>"],
["Beispiele, wann ein Analyst bedingte Formatierung braucht?","Kennzahlen-Einbrüche hervorheben, Heatmap für Retention-Kohorten, Ausreißer markieren, überfällige Deadlines, Top-10-Werte."],
["Wie funktioniert COUNTIF? Beispiel.","Zählt Zellen, die eine Bedingung erfüllen.","<code>=COUNTIF(C:C,\"Ukraine\")</code> — wie viele Zeilen das Land Ukraine haben."],
["Wie nutzt man RANK?","Liefert den Rang einer Zahl unter anderen (1 = größte standardmäßig).","<code>=RANK(B2,$B$2:$B$50)</code> — Rang eines Verkäufers nach Umsatz."],
["Formeln zur Fehlerbehandlung? Beispiel.","IFERROR (jeder Fehler), IFNA (nur #N/A), ISERROR/ISBLANK für Prüfungen oder Vorbeugen: IF(B2=0,0,A2/B2).","<code>=IFERROR(A2/B2,0)</code>"]
]},
{title:"SQL", intro:"Eine Top-Fähigkeit für Analysten. Neben Theorie: Abfragen üben auf LeetCode, StrataScratch, HackerRank, Codewars.", qs:[
["Was ist SQL und wofür wird es genutzt?","Eine Abfragesprache für relationale Datenbanken. Analysten holen, filtern, verknüpfen und aggregieren damit Daten."],
["In welcher Umgebung hast du SQL genutzt?","Nenne echte: PostgreSQL, MySQL, BigQuery, ClickHouse, DBeaver, Übungsplattformen (StrataScratch, LeetCode)."],
["Deine Schwächen in SQL?","Ehrlich, aber mit Plan: „Bei Fensterfunktionen bin ich noch langsam, deshalb löse ich jede Woche Aufgaben auf StrataScratch.“"],
["Kommt ein Datenanalyst ohne SQL aus?","Selten. Fast alle Daten liegen in Datenbanken; ohne SQL bist du von anderen oder fertigen Exporten abhängig."],
["Schreibreihenfolge: FROM, LIMIT, GROUP BY, SELECT, ORDER BY, WHERE","SELECT → FROM → WHERE → GROUP BY → (HAVING) → ORDER BY → LIMIT."],
["Ausführungsreihenfolge dieser Klauseln","FROM → WHERE → GROUP BY → (HAVING) → SELECT → ORDER BY → LIMIT. Deshalb kann ein Alias aus SELECT nicht in WHERE verwendet werden."],
["Was macht GROUP BY? Worauf achten in SELECT?","Gruppiert Zeilen nach Spaltenwerten, um Aggregate pro Gruppe zu berechnen. In SELECT dürfen nur GROUP-BY-Spalten oder Aggregatfunktionen stehen.","<code>SELECT country, SUM(revenue) FROM sales GROUP BY country</code>"],
["WHERE vs. HAVING?","WHERE filtert Zeilen VOR der Gruppierung, HAVING filtert Gruppen DANACH (hier sind Aggregate erlaubt).","<code>... GROUP BY country HAVING SUM(revenue) > 1000</code>"],
["Was sind Aggregatfunktionen? Welche kennst du?","Funktionen, die aus vielen Zeilen einen Wert liefern: COUNT, SUM, AVG, MIN, MAX (in vielen DBMS auch STDDEV, VARIANCE)."],
["Ohne was funktioniert eine Aggregatfunktion nicht?","Ohne eine Zeilenmenge (FROM). Stehen in SELECT normale Spalten und ein Aggregat, braucht man GROUP BY über diese Spalten."],
["Wie berechnet man die Standardabweichung in SQL?","STDDEV / STDDEV_SAMP (Stichprobe) oder STDDEV_POP (Grundgesamtheit).","<code>SELECT STDDEV_SAMP(price) FROM orders</code>"],
["Wie funktioniert CASE? Wann nutzen?","Das „IF“ von SQL: liefert je nach Bedingung unterschiedliche Werte. Für Kategorisierung, Segmente, bedingte Aggregate.","<code>CASE WHEN age < 18 THEN 'teen' ELSE 'adult' END</code>"],
["Wozu BETWEEN? Beispiel.","Prüft, ob ein Wert in einem Bereich liegt, Grenzen eingeschlossen.","<code>WHERE order_date BETWEEN '2024-01-01' AND '2024-01-31'</code>"],
["Wie sortiert man Ergebnisse?","ORDER BY Spalte ASC (aufsteigend, Standard) oder DESC (absteigend). Mehrere Spalten möglich."],
["Welche JOIN-Arten kennst du? Unterschiede?","INNER — nur Treffer in beiden Tabellen. LEFT — alle aus der linken + Treffer aus der rechten (sonst NULL). RIGHT — umgekehrt. FULL — alle Zeilen aus beiden. CROSS — jede mit jeder."],
["JOIN vs. UNION?","JOIN fügt Spalten hinzu (Tabellen „seitlich“ per Schlüssel verbinden). UNION fügt Zeilen hinzu (Ergebnisse untereinander; Spalten müssen in Anzahl und Typ passen)."],
["Wofür ist ein SELF JOIN?","Eine Tabelle mit sich selbst verknüpfen — wenn Zeilen miteinander in Beziehung stehen.","Mitarbeiter und ihr Vorgesetzter in derselben Tabelle employees."],
["UNION vs. UNION ALL?","UNION entfernt Duplikate (langsamer), UNION ALL behält alle Zeilen (schneller). Wenn es keine Duplikate gibt oder sie gebraucht werden — UNION ALL."],
["Was sind Fensterfunktionen?","Berechnen Werte über ein „Fenster“ von Zeilen, ohne sie wie GROUP BY zusammenzufassen. Für Ränge, kumulierte Summen, Vergleich mit der vorherigen Zeile.","<code>ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY date)</code>, <code>SUM(x) OVER (ORDER BY date)</code>, LAG/LEAD."],
["Wie entfernt man schnell Duplikate?","SELECT DISTINCT, GROUP BY über alle Spalten oder ROW_NUMBER() OVER (PARTITION BY ...) und rn = 1 behalten."],
["Wie wandelt man als Text gespeicherte Zahlen um?","CAST(col AS INTEGER/NUMERIC) oder col::numeric (PostgreSQL). Vorher ggf. Leerzeichen/Kommas mit TRIM/REPLACE entfernen."],
["Wie gibt man die Top 10 Länder nach Umsatz aus?","Absteigend sortieren + LIMIT.","<code>SELECT country, SUM(revenue) r FROM t GROUP BY country ORDER BY r DESC LIMIT 10</code>"],
["Was ist NULL? Wie wird man es los?","NULL ist das Fehlen eines Wertes (nicht 0, kein leerer String). Filtern: WHERE col IS NOT NULL; ersetzen: COALESCE(col, 0)."],
["Wofür ist LIKE?","Mustersuche in Text.","<code>WHERE email LIKE '%@gmail.com'</code>"],
["TABLE vs. VIEW?","Eine TABLE speichert Daten physisch. Eine VIEW ist eine gespeicherte Abfrage („virtuelle Tabelle“), Daten werden beim Zugriff berechnet."],
["Wozu AND, OR, NOT?","Logische Operatoren zum Kombinieren von Bedingungen: AND — beide wahr, OR — mindestens eine, NOT — Verneinung."],
["Welche Platzhalterzeichen kennst du?","% — beliebig viele beliebige Zeichen; _ — genau ein Zeichen. (SQL Server zusätzlich [abc] — Zeichenmenge.)"],
["IN-Operator — Beispiel und Vorteil","Prüft, ob ein Wert in einer Liste ist. Kürzer und klarer als viele ORs; akzeptiert eine Unterabfrage.","<code>WHERE country IN ('UA','PL','DE')</code>"],
["Wozu AS?","Vergibt einen Alias für Spalte oder Tabelle — für bessere Lesbarkeit.","<code>SELECT SUM(revenue) AS total FROM orders AS o</code>"],
["Welche SQL-Operatoren kennst du?","Arithmetisch (+ − * / %), Vergleich (=, <>, >, <), logisch (AND, OR, NOT), IN, BETWEEN, LIKE, IS NULL, EXISTS."],
["Wozu Kommentare in SQL?","Um die Logik komplexer Abfragen für sich und Kollegen zu erklären und Codeteile vorübergehend „auszuschalten“."],
["Welche Kommentararten kennst du?","Einzeilig: <code>-- Text</code>. Mehrzeilig: <code>/* Text */</code>."],
["Wie schützt man Berechnungen vor NULL?","COALESCE(col, 0) oder CASE WHEN col IS NULL THEN 0 ELSE col END. Jede Arithmetik mit NULL ergibt NULL."],
["Wie schützt man sich vor Division durch null?","NULLIF im Nenner — Ergebnis wird NULL statt eines Fehlers.","<code>revenue / NULLIF(users, 0)</code>"],
["Warum Abfragen optimieren?","Damit sie schneller und günstiger laufen (in Cloud-DBs zahlt man pro gescannte Datenmenge). Beispiele: nur benötigte Spalten statt SELECT *, früh filtern, Indizes/Partitionen nutzen."],
["Was ist ETL?","Extract — Daten aus Quellen holen, Transform — bereinigen und umformen, Load — ins Data Warehouse laden. So werden Daten für Analysen vorbereitet (Airflow, dbt usw.)."],
["Was sind Indizes?","Eine Struktur, die das Finden von Zeilen beschleunigt (wie ein Inhaltsverzeichnis). Schnelleres Lesen, aber langsameres Schreiben und mehr Speicher."],
["Welche Abfrage liefert die Anzahl eindeutiger Kunden?","Richtig ist <b>c)</b> <code>SELECT COUNT(DISTINCT CustomerID) FROM Customers;</code>. a) zählt alle Zeilen, b) DISTINCT wirkt auf eine einzelne Zahl, d) Syntaxfehler."]
]},
{title:"BI-Tools (Power BI, Tableau)", intro:"Eigene Dashboards sind das beste Argument: Das Gespräch dreht sich dann um deine Arbeit statt um Theorie.", qs:[
["Welche BI-Tools nutzt du?","Nenne echte (Power BI, Tableau, Looker Studio, Metabase) und wofür: Verkaufs-Dashboards, Monitoring von Produktkennzahlen."],
["Hast du selbst gebaute Dashboards?","Erkläre: welche Geschäftsfrage es beantwortet, Datenquellen, Kennzahlen, Visualisierungen, gefundene Insights. Link bereithalten."],
["Was ist Power Query?","Ein Excel/Power-BI-Tool zum Laden und Aufbereiten von Daten (ETL ohne Code): Quellen anbinden, bereinigen, Transformationen, die sich automatisch wiederholen."],
["Wie unterscheidet sich Power Query von der Verarbeitung in Excel?","In Power Query werden Schritte aufgezeichnet und bei Aktualisierung automatisch wiederholt; das Original bleibt unverändert; besser für große Datenmengen. In Excel ist die Verarbeitung manuell und muss wiederholt werden."],
["Welche Datenquellen unterstützt Power Query?","Excel, CSV, TXT, Ordner mit Dateien, Datenbanken (SQL Server, PostgreSQL, MySQL), Webseiten, APIs, SharePoint, Google BigQuery und mehr."],
["Wie bereinigt man Daten in Power Query?","Überflüssige Spalten/Zeilen entfernen, Duplikate und Leerwerte entfernen, Trim/Clean, Typen ändern, Spalten teilen, Werte ersetzen, filtern."],
["Wie arbeitet man mit Datentypen in Power Query?","Typ-Symbol neben dem Spaltennamen anklicken und wählen (Text, Ganze Zahl, Datum …). Power Query erkennt Typen selbst, aber das sollte man prüfen. Fehlgeschlagene Umwandlungen erscheinen als Error."],
["Wie findet und entfernt man Duplikate in Power Query?","Spalte(n) markieren → Start → Zeilen verringern → Zeilen entfernen → Duplikate entfernen. Finden: Zeilen beibehalten → Duplikate beibehalten."],
["Wie benennt man eine Spalte um?","Doppelklick auf die Überschrift oder Rechtsklick → Umbenennen."],
["Wofür ist der Bereich „Angewendete Schritte“?","Zeigt die gesamte Historie der Transformationen. Man kann zu einem Schritt zurück, ihn ändern oder löschen — der Prozess ist transparent und reproduzierbar."],
["Wofür ist „Spalte teilen“?","Eine Spalte anhand eines Trennzeichens oder einer Zeichenanzahl in mehrere aufteilen.","„Max Müller“ → „Max“ und „Müller“."],
["Wie entfernt man leere Werte?","Spaltenfilter → (null)/(leer) abwählen oder Start → Zeilen verringern → Zeilen entfernen → Leere Zeilen entfernen."],
["Wie kombiniert man Daten in Power Query?","Abfragen zusammenführen (Merge) — wie JOIN (Spalten per Schlüssel). Abfragen anfügen (Append) — wie UNION (Zeilen)."],
["Was ist DAX?","Die Formelsprache von Power BI für berechnete Measures und Spalten.","<code>Total Sales = SUM(Sales[Amount])</code>, CALCULATE, FILTER."],
["Worksheet vs. Dashboard in Tableau?","Ein Worksheet ist eine einzelne Visualisierung. Ein Dashboard ist eine Fläche, die mehrere Worksheets mit Filtern und Interaktivität kombiniert."],
["Measure vs. Dimension in Tableau?","Dimension — qualitative Daten zum Gruppieren (Land, Datum, Kategorie). Measure — numerische Daten zum Aggregieren (Umsatz, Anzahl)."],
["Was ist ein berechnetes Feld (Calculated Field)?","Ein neues Feld, das per Formel aus vorhandenen entsteht.","Profit Ratio = SUM([Profit]) / SUM([Sales])."],
["Diskrete vs. stetige Felder?","Diskret (blau) — einzelne Werte, erzeugen Überschriften/Kategorien. Stetig (grün) — kontinuierliche Skala, erzeugt eine Achse."],
["Was sind Parameter in Tableau?","Eine Variable, die der Nutzer selbst ändert (Zahl, Datum, Liste) — für Interaktivität: Kennzahl wählen, Schwellenwert, Top-N."],
["Wie erstellt man ein berechnetes Feld mit Bedingungen?","Mit IF/CASE.","<code>IF [Sales] > 1000 THEN \"High\" ELSE \"Low\" END</code>"],
["Was braucht man unbedingt für eine Karte in Tableau?","Geografische Daten: ein Feld mit geografischer Rolle (Land, Stadt, PLZ) oder Breiten-/Längengrad."],
["Wofür sind Gruppen in Tableau?","Mehrere Werte einer Dimension zu einer Kategorie zusammenfassen.","Länder zu „Europa“, „Asien“ gruppieren."]
]},
{title:"Statistik", intro:"Buchtipp: „Practical Statistics for Data Scientists“.", qs:[
["Was ist das arithmetische Mittel?","Die Summe aller Werte geteilt durch ihre Anzahl.","(2+4+9)/3 = 5."],
["Was ist der Median? Unterschied zum Mittelwert?","Der mittlere Wert einer sortierten Reihe. Große Werte „ziehen“ den Mittelwert, den Median nicht.","Gehälter 10, 12, 15, 100: Mittel 34,25, Median 13,5."],
["Vorteil des Medians gegenüber dem Mittelwert?","Robust gegen Ausreißer — beschreibt den „typischen“ Wert bei schiefen Daten besser (Einkommen, Immobilienpreise)."],
["Was ist der Modus?","Der häufigste Wert.","1, 2, 2, 3, 5 → Modus 2."],
["Was sind Quartile?","Werte, die sortierte Daten in 4 gleiche Teile teilen: Q1 (25 %), Q2 (50 %, Median), Q3 (75 %)."],
["Welches Quartil ist der Median?","Das zweite (Q2)."],
["Was ist ein Quantil?","Der Wert, unter dem ein bestimmter Anteil der Daten liegt. 0,9-Quantil — 90 % der Werte sind kleiner.","„90 % der Seiten laden schneller als 2 s.“"],
["Was bedeutet das 99. Perzentil?","Der Wert, unter dem 99 % der Beobachtungen liegen. Oft für Serverantwortzeiten oder Anomalie-Erkennung."],
["Was ist der Interquartilsabstand (IQR)?","IQR = Q3 − Q1 — die Streuung der mittleren 50 % der Daten."],
["Wie entfernt man Ausreißer mit dem IQR?","Ausreißer ist alles unter Q1 − 1,5·IQR oder über Q3 + 1,5·IQR."],
["Was ist ein Ausreißer?","Ein Wert, der stark vom Rest der Daten abweicht (Fehler, seltenes Ereignis oder wichtiges Signal)."],
["Du siehst einen Ausreißer. Was tust du?","Zuerst die Ursache verstehen: Datenfehler (korrigieren/entfernen), echtes seltenes Ereignis (behalten, Median verwenden, separat analysieren). Nicht blind löschen."],
["Welche 5 Kennwerte zeigt ein Boxplot?","Minimum, Q1, Median, Q3, Maximum (Whisker meist bis 1,5·IQR, Punkte darüber hinaus sind Ausreißer)."],
["Was ist die Normalverteilung?","Eine symmetrische „Glocke“ um den Mittelwert; Mittelwert = Median = Modus; beschrieben durch Mittelwert und Standardabweichung."],
["Was ist der zentrale Grenzwertsatz?","Mittelwerte vieler Stichproben sind annähernd normalverteilt, auch wenn die Daten selbst es nicht sind. Deshalb funktionieren t-Tests und Konfidenzintervalle."],
["Die Drei-Sigma-Regel?","Bei Normalverteilung liegen ~68 % der Daten innerhalb ±1σ, ~95 % innerhalb ±2σ, ~99,7 % innerhalb ±3σ. Werte jenseits von 3σ sind Ausreißer-Kandidaten."],
["Wie sieht der Graph einer Normalverteilung aus?","Eine symmetrische Glockenkurve mit Spitze beim Mittelwert, die Enden fallen beidseitig sanft ab."],
["Was ist die Standardabweichung?","Die durchschnittliche Streuung um den Mittelwert (Wurzel der Varianz). Klein — Daten dicht, groß — weit gestreut."],
["Was ist die Binomialverteilung?","Anzahl der „Erfolge“ in n unabhängigen Versuchen mit gleicher Wahrscheinlichkeit p.","Wie viele von 100 Nutzern kaufen bei 5 % Konversion."],
["Alle Studierenden bekamen +2.500 UAH. Wie ändern sich Mittelwert und Median?","Beide steigen um 2.500 UAH."],
["Alle Studierenden bekamen +2.500 UAH. Wie ändern sich Std.-Abw. und IQR?","Gar nicht — eine Verschiebung um eine Konstante ändert die Streuung nicht."],
["Einkommen stiegen um 7 %. Mittelwert und Median?","Beide steigen um 7 % (mal 1,07)."],
["Einkommen stiegen um 7 %. Std.-Abw. und IQR?","Beide steigen um 7 % — Multiplikation skaliert auch die Streuung."],
["Grundgesamtheit vs. Stichprobe?","Grundgesamtheit — alle interessierenden Objekte (alle Nutzer). Stichprobe — der tatsächlich untersuchte Teil. Aus der Stichprobe schließen wir auf die Grundgesamtheit."],
["Was ist eine verzerrte Stichprobe (Sample Bias)?","Eine Stichprobe, die die Grundgesamtheit nicht repräsentiert.","Zufriedenheitsumfrage nur unter Leuten, die selbst eine Bewertung hinterlassen haben."],
["Regression zur Mitte?","Nach einem extremen Ergebnis liegt das nächste meist näher am Durchschnitt.","Nach der schlechtesten Verkaufswoche ist ein Teil der „Verbesserung“ nur eine Rückkehr zum Normalen."],
["Die Idee des Bootstrappings?","Wiederholt mit Zurücklegen aus den eigenen Daten ziehen und die Statistik berechnen — so schätzt man ihre Streuung und ein Konfidenzintervall ohne Verteilungsannahmen."],
["Korrelationskoeffizient? Wertebereich?","Maß für den linearen Zusammenhang zweier Variablen, von −1 bis 1."],
["Welche Arten von Korrelation gibt es?","Positiv (eine steigt — andere steigt), negativ (eine steigt — andere fällt), null. Außerdem schwach/stark; linear (Pearson) und Rang (Spearman)."],
["Was sagt fehlende Korrelation aus?","Es gibt keinen LINEAREN Zusammenhang. Ein nichtlinearer (z. B. U-förmiger) kann existieren."],
["Was ist eine Korrelationsmatrix?","Eine Tabelle der Korrelationskoeffizienten zwischen allen Variablenpaaren — man sieht schnell, was womit zusammenhängt."],
["Korrelation vs. Kausalität?","Korrelation — Variablen bewegen sich gemeinsam. Kausalität — eine verursacht die andere. Korrelation beweist keine Ursache (es kann einen dritten Faktor geben)."],
["Beispiel für Korrelation ohne Kausalität?","Eisverkäufe und Ertrinkungsfälle korrelieren — die Ursache für beides ist Hitze."],
["Was ist ein Konfidenzintervall?","Ein Bereich, der den wahren Parameterwert mit einer bestimmten Sicherheit (z. B. 95 %) enthält. Zeigt die Genauigkeit der Schätzung."],
["Simpson-Paradoxon?","Ein Trend in jeder Gruppe kehrt sich um oder verschwindet, wenn man die Gruppen zusammenfasst. Kann täuschen, wenn man Segmente nicht betrachtet.","Konversion ist für B in beiden Ländern höher, insgesamt aber für A — wegen unterschiedlichem Traffic-Mix."],
["Was zeigt R²?","Den Anteil der Varianz der Zielvariable, den das Modell erklärt (0–1). R² = 0,8 — das Modell erklärt 80 % der Variabilität."],
["Was ist Extrapolation?","Vorhersage außerhalb des Bereichs vorhandener Daten. Riskant, da sich der Trend ändern kann."],
["Lineare vs. logistische Regression?","Linear sagt eine Zahl voraus (Umsatz). Logistisch die Wahrscheinlichkeit einer Klasse (kauft / kauft nicht)."],
["Weitere Regressionen für numerische Prognosen?","Polynomial, Ridge/Lasso, Entscheidungsbäume und Random Forest, Gradient Boosting (XGBoost), für Zeitreihen — ARIMA, Prophet."],
["Was ist Accuracy/Precision bei Klassifikation?","Accuracy — Anteil aller richtigen Vorhersagen. Precision — wie viele der als „ja“ vorhergesagten wirklich „ja“ sind."],
["Was ist eine Konfusionsmatrix?","Eine 2×2-Tabelle: TP, FP, FN, TN — richtige und falsche Vorhersagen je Klasse.","Spamfilter: TP — Spam als Spam erkannt, FP — normale Mail im Spam."]
]},
{title:"Wahrscheinlichkeit & Kombinatorik", intro:"Formeln: Permutationen n!, Kombinationen C(n,k) = n! / (k!·(n−k)!).", qs:[
["Was ist bedingte Wahrscheinlichkeit?","Die Wahrscheinlichkeit von A, wenn B bereits eingetreten ist: P(A|B) = P(A und B) / P(B)."],
["Wofür ist der Satz von Bayes?","Um die Wahrscheinlichkeit einer Hypothese mit neuen Daten zu aktualisieren: P(A|B) = P(B|A)·P(A) / P(B).","Wahrscheinlichkeit einer Krankheit bei positivem Test."],
["Wahrscheinlichkeit für genau 5-mal Kopf bei 10 Würfen?","C(10,5) / 2¹⁰ = 252 / 1024 ≈ 24,6 %."],
["Das Ziegenproblem (Monty Hall)","3 Türen, hinter einer ein Auto. Du wählst eine, der Moderator öffnet eine leere der anderen. Wechseln ist besser: 2/3 Gewinnchance statt 1/3."],
["Unabhängige vs. sich ausschließende Ereignisse?","Unabhängig — eines beeinflusst das andere nicht (zwei Münzwürfe). Ausschließend — können nicht zusammen eintreten (1 und 6 bei einem Würfelwurf)."],
["Wahrscheinlichkeit eines bestimmten Werts bei einem Würfel? Bei zwei?","Ein Würfel: 1/6. Zwei Würfel, bestimmtes Paar (z. B. 6 und 6): 1/36. Summe 7: 6/36 = 1/6."],
["Wie viele Möglichkeiten, k aus n zu wählen?","Kombinationen C(n,k) = n! / (k!·(n−k)!), wenn die Reihenfolge egal ist."],
["Ein Komitee aus 4 von 10 Personen?","C(10,4) = 210."],
["Wie viele Möglichkeiten, 5 Bücher anzuordnen?","5! = 120."],
["3 von 8 Studierenden auswählen?","C(8,3) = 56."],
["5 von 7 Freunden auswählen?","C(7,5) = 21."],
["10 Bälle: 7 rot, 3 blau. 2 verschiedenfarbige wählen?","7 × 3 = 21."],
["12 Gegenstände anordnen?","12! = 479.001.600."],
["Ein Team aus 11 von 20 Kandidaten?","C(20,11) = 167.960."],
["Wege in einem 5×5-Gitter, nur nach unten/rechts?","Bei 5×5 Feldern: 5 runter + 5 rechts = C(10,5) = 252. Bei 5×5 Punkten: C(8,4) = 70. Im Interview die Aufgabe klären!"],
["2 Leiter und 3 Stellvertreter aus 10 wählen?","C(10,2) × C(8,3) = 45 × 56 = 2.520."]
]},
{title:"A/B-Tests", intro:"Kenne die Theorie, auch wenn du noch keine Tests durchgeführt hast. Unten der frequentistische (klassische) Ansatz.", qs:[
["Die Idee von A/B-Tests?","Nutzer zufällig in Gruppen teilen: A sieht die alte Version, B die neue. Eine Kennzahl vergleichen und statistisch prüfen, dass der Unterschied nicht zufällig ist."],
["Hast du A/B-Tests durchgeführt?","Falls nein — erkläre, wie du es machen würdest, oder beschreibe ein Lernprojekt: Hypothese, Kennzahl, Stichprobengröße, Dauer, Fazit."],
["Ist ein A/B-Test das beste Werkzeug?","Er ist der „Goldstandard“ für kausale Aussagen, aber nicht immer: Er braucht Traffic, Zeit und Randomisierung. Manchmal ist qualitative Forschung oder Datenanalyse einfacher."],
["Alternativen zum A/B-Test?","Quasi-Experimente (Difference-in-Differences), Vorher/Nachher-Analyse, Causal Impact, Usability-Tests, Umfragen, Multi-Armed Bandits."],
["AA-Test und AAB-Test?","AA — beide Gruppen sehen dasselbe; prüft, dass der Split funktioniert und keine falschen Unterschiede entstehen. AAB — zwei Kontrollgruppen + Test: Qualitätskontrolle und Test zugleich."],
["Wann ist ein A/B-Test nicht sinnvoll?","Wenig Traffic, offensichtliche/zwingende Änderungen (Bugs, rechtlich), große Redesigns mit Neuheitseffekt, Netzwerkeffekte, ethische Grenzen."],
["Grundablauf eines A/B-Tests","Hypothese → Ziel- und Guardrail-Kennzahlen → MDE, α, Power → Stichprobengröße und Dauer → Randomisierung → Laufen lassen ohne Zwischenblicke → Analyse (Stat. Test) → Entscheidung."],
["Nullhypothese?","H₀: Es gibt keinen Unterschied zwischen den Varianten.","Konversion A = Konversion B."],
["Alternativhypothese?","H₁: Es gibt einen Unterschied.","Der neue Button verändert die Konversion."],
["Was ist Alpha?","Signifikanzniveau — die akzeptierte Wahrscheinlichkeit eines Fehlers 1. Art. Meist 0,05 (manchmal 0,01 oder 0,1)."],
["Was ist MDE?","Minimum Detectable Effect — der kleinste Effekt, den der Test zuverlässig erkennen kann. Hängt von Stichprobengröße, α, Power und Varianz der Kennzahl ab."],
["Fehler 1. Art?","Einen Effekt finden, den es nicht gibt (falsch positiv).","Eine „Verbesserung“ ausrollen, die in Wahrheit nichts bewirkt."],
["Fehler 2. Art?","Einen vorhandenen Effekt übersehen (falsch negativ).","Ein nützliches Feature verwerfen."],
["Auf welchen Fehler bezieht sich die Power?","Power = 1 − β, wobei β die Wahrscheinlichkeit eines Fehlers 2. Art ist. Üblich sind 80 % Power."],
["Wie schätzt man die Testdauer?","Benötigte Stichprobengröße (aus MDE, α, Power) durch den täglichen Traffic teilen. Plus mindestens 1–2 volle Wochen wegen Wochensaisonalität."],
["Was ist statistische Signifikanz?","Der Unterschied ist so groß, dass er unter H₀ unwahrscheinlich zufällig entsteht (p-Wert < α)."],
["Was ist der p-Wert?","Die Wahrscheinlichkeit, ein solches oder stärkeres Ergebnis zu erhalten, wenn es in Wahrheit keinen Effekt gibt. p = 0,03 — ohne Effekt kämen solche Daten nur in 3 % der Fälle vor."],
["(1 − p-Wert) = 0,94. Was tust du?","p = 0,06 > 0,05 — nicht signifikant. Nicht „hinbiegen“ und den Test nicht willkürlich verlängern. H₀ kann nicht verworfen werden; ggf. Test mit größerer Stichprobe neu planen."],
["Risiken, laufende Tests zwischendurch anzuschauen?","Peeking: Stoppt man, sobald p < 0,05, steigt die Gefahr eines falschen Schlusses stark. Bis zur geplanten Stichprobe laufen lassen (oder sequentielle Verfahren nutzen)."],
["Welche statistischen Tests kennst du?","Z-Test für Anteile (Konversion), t-Test (Mittelwerte — Warenkorb, Zeit), Mann-Whitney (nichtparametrisch), Chi-Quadrat, Bootstrap. Die Wahl hängt von Kennzahltyp und Verteilung ab."],
["Konversion 5 %, erwartet 5,5 %. Nutzer pro Variante?","Bei α = 0,05 und 80 % Power: n ≈ 16·p(1−p)/δ² ≈ 16·0,0475 / 0,005² ≈ ~31 Tsd. pro Variante."],
["1.000 Nutzer: 60 Konversionen im alten, 75 im neuen Design. Fazit?","6 % vs. 7,5 %. Z-Test: z ≈ 1,34, p ≈ 0,18 > 0,05 — nicht signifikant. Das neue Design wird darauf gestützt nicht eingeführt; größere Stichprobe nötig."],
["Test mit 20 % höherem Abo-Preis. Wie analysieren?","Hauptkennzahl — Umsatz pro Nutzer (ARPU/LTV), nicht Konversion (die sinkt wahrscheinlich). Guardrails — Churn, Rückerstattungen. Langfristig betrachten."],
["Mehr als zwei Varianten — was ändert sich?","Korrektur für multiples Testen (Bonferroni, Holm), größere Stichprobe, manchmal ANOVA. Sonst steigt die Chance auf einen falschen „Gewinner“."],
["Kann man mehrere Tests gleichzeitig laufen lassen?","Ja, wenn sie unabhängig sind — die Randomisierung „mischt“ die Effekte. Betreffen sie denselben Produktteil und können interagieren — Layer/Zielgruppen trennen oder nacheinander testen."],
["5 Features zum Testen. Welches zuerst?","Priorisieren: erwarteter Impact × Sicherheit / Aufwand (ICE, RICE). Plus benötigter Traffic und Zeit."],
["Was ist beim A/B-Test am wichtigsten?","Klare Hypothese und richtige Kennzahl, korrekte Randomisierung, ausreichende Stichprobe und Disziplin (kein Peeking)."],
["Warum ist Ethik wichtig?","Ein Test betrifft echte Menschen.","Test manipulativer „Dark Patterns“ beim Abo oder unterschiedliche Preise für vulnerable Gruppen."],
["Minimale Testdauer?","Meist mindestens 1 volle Woche (besser 2), um Wochensaisonalität abzudecken, auch wenn die Stichprobe früher erreicht ist."],
["A/B-Test vs. schrittweises Ausrollen an alle?","Beim A/B-Test gibt es eine zeitgleiche Kontrollgruppe — der Effekt wird von Saisonalität/Marketing getrennt. Beim Ausrollen an alle vergleicht man „vorher/nachher“, und jedes externe Ereignis verfälscht das Ergebnis."],
["Was ist das Peeking-Problem und wie vermeidet man es?","Regelmäßig Ergebnisse ansehen und bei der ersten Signifikanz stoppen → mehr falsch positive Ergebnisse. Vermeiden: Stichprobe/Dauer vorab festlegen oder Sequential Testing nutzen."]
]},
{title:"Produktkennzahlen", intro:"Verstehe nicht nur die Formeln, sondern auch, was eine Kennzahl über das Geschäft aussagt.", qs:[
["Welche Produktkennzahlen kennst du?","DAU/WAU/MAU, Retention, Churn, Konversion, LTV, ARPU, ARPPU, CAC, Sticky Factor, durchschnittlicher Warenkorb, Sitzungsdauer, NPS."],
["Was ist eine North-Star-Kennzahl?","Die Hauptkennzahl, die den Nutzen des Produkts für Nutzer am besten widerspiegelt und mit dem Geschäft verknüpft ist.","Spotify — Hördauer, Airbnb — gebuchte Nächte."],
["Was ist DAU?","Daily Active Users — eindeutige Nutzer, die an einem Tag eine Zielaktion ausgeführt haben."],
["Aus welchen Nutzertypen besteht DAU?","Neue (heute zum ersten Mal), wiederkehrende (gehaltene) und nach einer Pause reaktivierte Nutzer."],
["Was bedeutet „active“ in DAU?","Das definiert das Team: eine sinnvolle Aktion (App geöffnet, Inhalt angesehen, gekauft). Es sollte echten Nutzen widerspiegeln."],
["Was ist Konversion?","Der Anteil der Nutzer, die zur Zielaktion übergehen.","Von 1.000, die eine Produktseite öffneten, kauften 50 → 5 % Konversion."],
["10 Mio. Downloads — warum eine Vanity-Kennzahl?","Downloads bedeuten weder Nutzung noch Geld. Viele haben die App vielleicht sofort gelöscht. Retention, aktive Nutzer und Umsatz sind wichtiger."],
["Was ist LTV? Für welchen Zeitraum?","Lifetime Value — wie viel Geld ein Nutzer über die gesamte Zeit mit dem Produkt bringt. Oft über einen Horizont berechnet (LTV 30/90/365 Tage)."],
["Wie berechnet man LTV und was beeinflusst ihn?","Vereinfacht: ARPU × durchschnittliche Lebensdauer (oder ARPU / Churn). Außerdem: Marge, Retention, Preis, Kaufhäufigkeit."],
["Was ist ARPU? Unterschied zu LTV?","ARPU — durchschnittlicher Umsatz pro Nutzer in einem Zeitraum (Monat). LTV — über den gesamten „Lebenszyklus“."],
["ARPU vs. ARPPU? Was ist größer?","ARPU — Umsatz pro allen Nutzern, ARPPU — nur pro zahlenden. ARPPU ≥ ARPU, weil durch eine kleinere Zahl geteilt wird."],
["Was ist CAC?","Customer Acquisition Cost — Kosten, um einen Kunden zu gewinnen (Marketingausgaben / neue Kunden)."],
["Das Verhältnis LTV / CAC?","Zeigt, ob sich die Akquise lohnt. Gesunder Richtwert ~3:1."],
["LTV/CAC < 1, = 1, > 1?","< 1 — Verlust bei jedem Kunden. = 1 — Break-even (ohne andere Kosten). > 1 — profitabel; höher ist besser (sehr hoch kann aber bedeuten, dass zu wenig in Wachstum investiert wird)."],
["Warum braucht eine Firma mit LTV/CAC = 3 Investitionen?","CAC wird sofort bezahlt, LTV kommt über Jahre. Schnelles Wachstum braucht Geld „im Voraus“ — eine Liquiditätslücke."],
["Kann man ARPU statt LTV verwenden?","Nicht ganz: ARPU gilt pro Zeitraum und ignoriert, wie lange Nutzer bleiben. Für Marketingentscheidungen braucht man LTV."],
["Wie lange warten, um den LTV einer Kampagne zu berechnen?","Vollständig — bis die Kohorte „ausgelaufen“ ist. In der Praxis schaut man auf frühe Punkte (D7, D30) und prognostiziert den LTV anhand historischer Kurven."],
["Was ist Retention?","Der Anteil der Nutzer, die N Tage nach dem ersten Besuch zurückkehren.","Retention D7 = am 7. Tag zurückgekehrt / alle in der Kohorte."],
["Was ist Churn? Wie leitet man ihn aus Retention ab?","Der Anteil der Nutzer, die gegangen sind. Churn = 1 − Retention (für denselben Zeitraum)."],
["Rolling vs. klassische Retention?","Rolling — ein Nutzer gilt als gehalten, wenn er am Tag N ODER später zurückkam. Daher Rolling ≥ klassisch."],
["Was ist eine Kohorte?","Eine Nutzergruppe mit gemeinsamem Merkmal, meist dem Datum des ersten Besuchs. Kohorten ermöglichen faire Vergleiche, ohne alte und neue Nutzer zu mischen."],
["Sticky Factor?","DAU / MAU — wie oft Nutzer im Monat zurückkehren."],
["Wertebereich des Sticky Factors?","Von ~1/30 (jeder kommt einmal im Monat) bis 1 (alle täglich). Messenger ~50 %+."],
["Deine Lieblings-App — welche Kennzahlen sollte ihr Team verfolgen?","App wählen und Kennzahlen an ihren Nutzen knüpfen: Duolingo — DAU, Streaks, Retention, Konversion zu Super."],
["ChatGPT — welche Kennzahlen?","DAU/WAU, Gespräche/Nachrichten pro Nutzer, Retention, Konversion zu Plus, Abo-Churn, Antwortqualität (Likes/Dislikes), Latenz."],
["„Diia“ (ukrainische E-Government-App) — welche Kennzahlen?","Aktive Nutzer, Anteil erfolgreich abgeschlossener Dienste, Dauer bis zum Abschluss, Fehler/Abbrüche, Zufriedenheit (CSAT), Anteil digitaler statt Offline-Dienste."],
["Das Dashboard zeigt einen Konversionsrückgang. Wo suchst du?","1) Daten prüfen (Tracking, ETL, Dashboard). 2) Segmentieren: Plattform, Land, Kanal, Version. 3) Releases, Marketingänderungen, Saisonalität prüfen. 4) Finden, bei welchem Funnel-Schritt es einbricht."],
["Installationen +20 %. Ist das ein Erfolg?","Nicht unbedingt. Traffic-Qualität prüfen: Retention, Aktivierung, Umsatz neuer Nutzer und CAC."],
["DAU −10 %. Hypothesen?","Tracking-Problem, Bug im Release, weniger neue Nutzer (weniger Werbung), schlechtere Retention, Saisonalität/Feiertage, Problem auf einer Plattform oder in einem Land, Konkurrenz."],
["Trial-zu-Abo-Aktivierung +10 %. Ist der Gewinn gestiegen?","Nicht unbedingt: vielleicht mehr frühe Kündigungen/Erstattungen, ein anderer Tarif oder weniger Trial-Starts. Umsatz und Abonnenten-Retention betrachten."],
["Was ist ein Funnel?","Eine Abfolge von Schritten zu einer Zielaktion mit Konversion zwischen den Schritten. Zeigt, wo Nutzer verloren gehen.","Besuch → Warenkorb → Zahlung."],
["Wie entstehen Hypothesen?","„Wenn wir X tun, ändert sich Kennzahl Y um Z, weil …“. Quellen: Daten, Nutzerfeedback, Wettbewerber, UX-Forschung."],
["Wie priorisiert man Hypothesen?","Frameworks ICE (Impact, Confidence, Ease) oder RICE (+ Reach). Bewerten und sortieren."],
["Guardrail-Kennzahlen?","„Schutz“-Kennzahlen, die sich bei Änderungen nicht verschlechtern dürfen.","Konversion gestiegen — prüfen, dass Churn oder Ladezeit nicht gestiegen sind."],
["Was ist ein „Kennzahlenbaum“?","Zerlegung der Hauptkennzahl in Bestandteile.","Umsatz = Nutzer × Konversion × durchschnittlicher Warenkorb. Hilft zu finden, was sich genau geändert hat."]
]},
{title:"Python (Pandas, NumPy)", intro:"Lerne Pandas, NumPy, Matplotlib/Seaborn und baue ein paar Analyseprojekte.", qs:[
["Was sind Bibliotheken? Wozu braucht ein Analyst sie?","Sammlungen fertigen Codes, damit man nicht alles neu schreibt: Pandas — Tabellen, NumPy — Berechnungen, Matplotlib/Seaborn — Diagramme, SciPy — Statistik."],
["Welche Bibliotheken nutzt du?","Pandas, NumPy, Matplotlib, Seaborn, Plotly, SciPy / statsmodels, scikit-learn."],
["In welcher Umgebung hast du Python genutzt?","Jupyter Notebook / Google Colab — praktisch für schrittweise Analysen mit Diagrammen; VS Code / PyCharm — für Skripte."],
["Beispiele für Analysen mit Python?","Konkret beschreiben: EDA eines Datensatzes, Kohorten-Retention-Analyse, A/B-Test-Auswertung, Berichtsautomatisierung."],
["Hast du Python-Projekte?","GitHub/Kaggle zeigen: Aufgabe, Daten, was du gemacht hast, Schlussfolgerungen."],
["Visualisierungsbibliotheken und Erfahrung?","Matplotlib (Basis), Seaborn (statistische Diagramme), Plotly (interaktiv). Linien-, Balkendiagramme, Histogramme, Boxplots, Korrelations-Heatmaps."],
["EDA mit Python: was hast du gemacht?","<code>head()</code>, <code>info()</code>, <code>describe()</code>, <code>isnull().sum()</code>, <code>value_counts()</code>, <code>groupby()</code>, Histogramme, Boxplots, Korrelationen."],
["Wie hast du Ausreißer entfernt?","IQR: Zeilen zwischen Q1 − 1,5·IQR und Q3 + 1,5·IQR behalten, oder Z-Score.","<code>q1,q3 = df.x.quantile([.25,.75]); iqr=q3-q1; df = df[df.x.between(q1-1.5*iqr, q3+1.5*iqr)]</code>"],
["Wie importiert man eine CSV und wozu das Trennzeichen?","<code>pd.read_csv('file.csv', sep=';')</code>. Das Trennzeichen trennt Spalten (Komma, Semikolon, Tab). Falsch gewählt — alles landet in einer Spalte."],
["Wofür ist info()?","Zeigt Zeilenanzahl, Spaltennamen, Datentypen, Anzahl nicht-leerer Werte und Speicherbedarf."],
["Wie zeigt man die ersten 10 Zeilen?","<code>df.head(10)</code>"],
["Wie zeigt man nur die zweite Spalte?","<code>df.iloc[:, 1]</code> (nach Position) oder <code>df['name']</code>."],
["Wie verbindet man zwei Datensätze?","<code>pd.merge(df1, df2, on='id', how='left')</code> — wie JOIN; <code>pd.concat([df1, df2])</code> — wie UNION."],
["Wofür ist dropna()?","Entfernt Zeilen (oder mit axis=1 Spalten) mit fehlenden Werten (NaN)."],
["Wie entfernt man alle Duplikate?","<code>df.drop_duplicates()</code> (optional mit subset von Spalten)."],
["Wofür ist isnull().sum()?","Zählt fehlende Werte pro Spalte."],
["Wie sortiert man Daten?","<code>df.sort_values('price', ascending=False)</code>"],
["Wie benennt man eine Spalte um?","<code>df.rename(columns={'old': 'new'})</code>"],
["Wie ändert man einen Datentyp?","<code>df['col'].astype(int)</code>, bei unsauberen Zahlen — <code>pd.to_numeric(..., errors='coerce')</code>."],
["Arbeit mit Datum und Uhrzeit?","<code>pd.to_datetime()</code> zum Umwandeln, <code>.dt.year/.dt.month/.dt.day_name()</code>, Datumsdifferenzen, <code>resample()</code> zum Gruppieren nach Tag/Woche."],
["Wofür ist der Parameter axis?","axis=0 — entlang der Zeilen (eine Spalte hinunter), axis=1 — entlang der Spalten (über eine Zeile).","<code>df.drop('col', axis=1)</code> entfernt eine Spalte."],
["Wie entfernt man eine Spalte?","<code>df.drop(columns=['col'])</code>"],
["Wofür ist reset_index()?","Setzt den Index auf 0, 1, 2 … zurück (der alte wird zur Spalte; <code>drop=True</code> verwirft ihn). Nützlich nach Filtern oder groupby."],
["Wie exportiert man nach CSV?","<code>df.to_csv('result.csv', index=False)</code>"],
["Erkläre: df = pd.read_csv('housing_data.csv')","Liest eine CSV-Datei in einen Pandas-DataFrame und speichert ihn in df."],
["Erkläre: df['Price'].mean()","Der Mittelwert der Spalte Price."],
["Erkläre: df['Title'] = df['Title'].str.strip()","Entfernt führende und nachgestellte Leerzeichen aus jedem Wert in Title und überschreibt die Spalte."],
["Erkläre: df['Genres'].value_counts()","Häufigkeit jedes eindeutigen Werts in Genres, die häufigsten zuerst."],
["Erkläre: df['Date'] = pd.to_datetime(df['Date'])","Wandelt die Spalte Date von Text in Datum/Uhrzeit um, damit man nach Daten filtern und rechnen kann."]
]},
{title:"Weitere Fragen", intro:"Fragen zu deiner Denkweise und deinem Niveau.", qs:[
["Mit welcher größten Datenmenge hast du gearbeitet? Womit?","Ehrliche Zahl und Tool nennen (z. B. 2 Mio. Zeilen in Pandas, 100 GB in BigQuery) und wie du Performance-Probleme gelöst hast."],
["Eine andere Abteilung gibt dir die benötigten Daten nicht. Was tust du?","Erklären, wofür du sie brauchst und welchen Nutzen die Analyse bringt; den Grund herausfinden (Zugriff, Sicherheit, Auslastung); einen Kompromiss anbieten; bei Bedarf den Vorgesetzten einbeziehen."],

const LANGS = {
  uk:{data:DATA, html:"uk", title:"Співбесіда Junior Data Analyst: питання + приклад відповіді", search:"Пошук по питаннях і відповідях…", open:"Розгорнути все", close:"Згорнути все", ex:"Приклад", count:"питань", footer:"Питання зібрані зі статті Романа Повзика «250+ питань для підготовки до співбесіди початківцю в аналітиці даних» (DOU), логічні задачі доповнено. Відповіді — короткі пояснення для підготовки."},
  en:{data:DATA_EN, html:"en", title:"Junior Data Analyst interview: questions + sample answers", search:"Search questions and answers…", open:"Expand all", close:"Collapse all", ex:"Example", count:"questions", footer:"Questions are based on Roman Povzyk's article «250+ interview prep questions for junior data analysts» (DOU), with extra logic puzzles. Answers are short explanations for interview prep."},
  de:{data:DATA_DE, html:"de", title:"Vorstellungsgespräch Junior Data Analyst: Fragen + Beispielantworten", search:"Fragen und Antworten durchsuchen…", open:"Alle aufklappen", close:"Alle zuklappen", ex:"Beispiel", count:"Fragen", footer:"Die Fragen basieren auf dem Artikel von Roman Povzyk „250+ Fragen zur Interviewvorbereitung für Junior-Datenanalysten“ (DOU), ergänzt um Logikrätsel. Die Antworten sind kurze Erklärungen zur Vorbereitung."}
};
const IDS = DATA.map(s=>s.id);
let lang = "uk";
try{ const s=localStorage.getItem("ivlang"); if(LANGS[s]) lang=s; }catch(e){}

function render(){
  const L=LANGS[lang], toc=document.getElementById('toc'), main=document.getElementById('content');
  toc.innerHTML=''; main.innerHTML='';
  let n=0;
  L.data.forEach((s,i)=>{
    const id=IDS[i];
    toc.insertAdjacentHTML('beforeend',`<a href="#${id}">${s.title}<span>${s.qs.length}</span></a>`);
    let html=`<section id="${id}"><h2>${s.title}</h2><p class="intro">${s.intro}</p>`;
    s.qs.forEach(([q,a,ex])=>{
      n++;
      html+=`<details><summary><span class="n">${n}</span><span class="qt">${q}</span></summary><div class="a"><p>${a}</p>${ex?`<div class="ex"><b>${L.ex}:</b> ${ex}</div>`:''}</div></details>`;
    });
    main.insertAdjacentHTML('beforeend',html+'</section>');
  });
  document.documentElement.lang=L.html;
  document.title=L.title;
  document.querySelector('header h1').innerHTML=`${L.title} <small style="color:var(--muted);font-weight:400">· ${n} ${L.count}</small>`;
  document.getElementById('q').placeholder=L.search;
  document.getElementById('openAll').textContent=L.open;
  document.getElementById('closeAll').textContent=L.close;
  document.querySelector('footer').textContent=L.footer;
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  filter();
}
function filter(){
  const v=document.getElementById('q').value.trim().toLowerCase();
  document.querySelectorAll('section').forEach(sec=>{
    let any=false;
    sec.querySelectorAll('details').forEach(d=>{
      const hit=!v||d.textContent.toLowerCase().includes(v);
      d.classList.toggle('hidden',!hit); if(v) d.open=hit; if(hit)any=true;
    });
    sec.classList.toggle('hidden',!any);
  });
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{
  lang=b.dataset.l; try{localStorage.setItem("ivlang",lang);}catch(e){} render();
});
const all=()=>document.querySelectorAll('details');
document.getElementById('openAll').onclick=()=>all().forEach(d=>d.open=true);
document.getElementById('closeAll').onclick=()=>all().forEach(d=>d.open=false);
document.getElementById('q').addEventListener('input',filter);
render();
</script>
