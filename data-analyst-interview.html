<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Співбесіда Junior Data Analyst — питання та відповіді</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#667085;--accent:#2f6fed;--accent-soft:#e8f0fe;--border:#e4e7ec;--code:#f1f3f6}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--text:#e6e8ec;--muted:#98a2b3;--accent:#6b9bff;--accent-soft:#1f2a44;--border:#2b3240;--code:#262c38}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:18px;margin:0 auto 0 0}
input[type=search]{padding:8px 12px;border:1px solid var(--border);border-radius:8px;min-width:240px;background:var(--bg);color:var(--text);font-size:15px}
button{padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);cursor:pointer;font-size:14px}
button:hover{border-color:var(--accent)}
.layout{display:grid;grid-template-columns:250px 1fr;gap:24px;max-width:1200px;margin:0 auto;padding:20px}
nav{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 96px);overflow:auto}
nav a{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px}
nav a:hover{background:var(--accent-soft)}
nav a span{color:var(--muted)}
section{margin-bottom:36px}
section h2{margin:0 0 6px;font-size:22px}
.intro{color:var(--muted);margin:0 0 14px;font-size:14px}
details{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
summary{cursor:pointer;padding:12px 16px;list-style:none;display:flex;gap:10px;font-weight:500}
summary::-webkit-details-marker{display:none}
summary .n{color:var(--accent);min-width:28px;font-variant-numeric:tabular-nums}
details[open] summary{border-bottom:1px solid var(--border)}
.a{padding:12px 16px 14px 54px}
.a p{margin:0 0 6px}
.ex{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:14.5px}
.ex b{color:var(--accent)}
code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:14px;font-family:ui-monospace,Consolas,monospace}
.hidden{display:none}
mark{background:#ffe58a;color:inherit;border-radius:2px}
.lang{display:flex;gap:0}.lang button{border-radius:0;margin-left:-1px}.lang button:first-child{border-radius:8px 0 0 8px}.lang button:last-child{border-radius:0 8px 8px 0}.lang button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
footer{color:var(--muted);font-size:13px;text-align:center;padding:20px}
@media (max-width:820px){.layout{grid-template-columns:1fr}nav{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:4px}nav a{border:1px solid var(--border)}nav a span{margin-left:6px}.a{padding-left:16px}}
@media print{header,nav{display:none}.layout{display:block}details{break-inside:avoid}.a{display:block!important}}
</style>
</head>
<body>
<header>
  <h1>Співбесіда Junior Data Analyst: питання + приклад відповіді</h1>
  <input type="search" id="q" placeholder="Пошук по питаннях і відповідях…">
  <div class="lang"><button data-l="uk">UA</button><button data-l="en">EN</button><button data-l="de">DE</button></div>
  <button id="openAll">Розгорнути все</button>
  <button id="closeAll">Згорнути все</button>
</header>
<div class="layout">
  <nav id="toc"></nav>
  <main id="content"></main>
</div>
<footer>Питання зібрані зі статті Романа Повзика «250+ питань для підготовки до співбесіди початківцю в аналітиці даних» (DOU). Відповіді — короткі пояснення для підготовки.</footer>

<script>
// Формат: [питання, відповідь, приклад (необов'язково)]
const DATA = [
{id:"hr", title:"Прескрін з рекрутером", intro:"Правильних відповідей тут немає. Головне — відкритість, конкретика, говорити «я», а не «ми», і показати бажання вчитися.", qs:[
["Чому саме цей напрямок? Чому ти обрав аналітику?","Розкажи особисту історію: що тебе зачепило (люблю шукати закономірності, приймати рішення на основі фактів). Згадай, що вже зробив: курси, pet-проєкти.","«Я побачив, як звіт по продажах змінив рішення команди, і захотів робити це сам. Пройшов курс SQL і зробив 2 дашборди.»"],
["Що тобі найбільше і найменше подобається у твоїй професії?","Плюс — щось змістовне (знаходити інсайти, вплив на продукт). Мінус — чесний, але не критичний для роботи (наприклад, брудні дані забирають багато часу — і що ти з цим робиш)."],
["Опиши свій ідеальний робочий день.","Покажи, що тобі цікава сама робота: зрозуміла задача, час на глибокий аналіз, обговорення результатів з командою, щось нове вивчив."],
["Що найважливіше при співпраці з компанією: ріст, бенефіти, зарплата, команда, технології?","Для джуна сильна відповідь — ріст і команда, у якої можна вчитися. Будь чесним, але поясни чому."],
["Що може змусити тебе звільнитися?","Назви речі, що стосуються цінностей: відсутність розвитку, токсичність, нечесність. Не кажи «знайду, де платять більше»."],
["Чи зіштовхувався з конфліктами на роботі? Як вони вирішувалися?","Використай STAR: Ситуація → Задача → Дія → Результат. Покажи, що ти шукаєш рішення, а не винних."],
["Лід зайнятий, у тебе немає задач і фідбеку в перший місяць. Що робитимеш?","Проявиш ініціативу: вивчиш документацію, дані, дашборди, продукт; спитаєш колег; запропонуєш собі задачу; запишеш питання і коротко синхронізуєшся з лідом, коли в нього буде час."],
["З якою найважчою зміною зіштовхнувся у кар'єрі?","Часто це сам світч в ІТ. Розкажи, що було складно і як ти з цим впорався."],
["Чи є хтось у професії, хто надихає?","Назви конкретних людей, блоги, подкасти, авторів книг — це показує, що ти в темі."],
["Що тебе надихає? Розкажи про хобі.","Будь щирим. Добре, якщо хобі показує дисципліну чи допитливість (спорт, ігри зі статистикою, читання)."]
]},
{id:"logic", title:"Логіка та метод Фермі", intro:"Метод Фермі — швидка оцінка «на пальцях»: розбиваєш велике питання на маленькі, які можна прикинути. Інтерв'юеру важливий хід думок, а не точна цифра.", qs:[
["Скільки лампочок у Харкові?","Розбий на частини: населення (~1,4 млн) → домогосподарства (~600 тис.) × лампочок на квартиру (~10) = 6 млн. Додай офіси, магазини, вулиці (+30–50%). Відповідь: близько 8–10 млн. Головне — озвучувати припущення."],
["Скільки людей щодня народжується у світі?","~8 млрд людей, народжуваність ~17 на 1000 на рік → ~135 млн на рік / 365 ≈ 370 тис. на день."],
["Скільки соняшникової олії споживають домогосподарства України за рік?","~30 млн людей × ~10 л на людину на рік ≈ 300 млн л (≈ 270 тис. т). Важливо пояснити кожне припущення."],
["Світло вмикається через 1 хв, потім 30 с, 15 с… (щоразу вдвічі менше). Скільки разів увімкнеться за 2 хвилини?","1 + 0,5 + 0,25 + … = 2 хвилини — це сума нескінченного ряду. Тобто за 2 хвилини світло увімкнеться нескінченну кількість разів (за будь-який час менше 2 хв — скінченну)."],
["Є мотузки на 30 і 60 хв, горять нерівномірно. Як відміряти 45 хв?","Одночасно підпали 30-хвилинну з одного кінця і 60-хвилинну з одного кінця. Коли 30-хвилинна згорить (минуло 30 хв), у довгої лишилось 30 хв — підпали її з другого кінця, вона догорить за 15 хв. Разом 45."],
["Продовж: 82, 50, 26, … / 1, 1, 2, 3, 5, … / 1, 8, 27, 64, …","82 = 9²+1, 50 = 7²+1, 26 = 5²+1 → далі 3²+1 = <b>10</b>. Фібоначчі: кожне = сума двох попередніх → <b>8</b>. Куби 1³, 2³, 3³, 4³ → <b>125</b>."],
["Батончик і жуйка разом коштують 1,10 $. Батончик дорожчий за жуйку на 1 $. Скільки коштує жуйка?","Не 0,10! Якщо жуйка x, то батончик x + 1, разом 2x + 1 = 1,10 → x = <b>0,05 $</b>. Перевіряє, чи не відповідаєш «на автоматі»."],
["5 машин за 5 хвилин роблять 5 деталей. За скільки 100 машин зроблять 100 деталей?","Одна машина робить одну деталь за 5 хв. Тож 100 машин зроблять 100 деталей теж за <b>5 хвилин</b>."],
["Латаття щодня подвоює площу і повністю вкриває озеро за 48 днів. За скільки днів воно вкриє половину?","За <b>47 днів</b> — бо наступного дня площа подвоїться. Задача про експоненційне зростання."],
["Є 8 однакових на вигляд кульок, одна важча. Скільки мінімум зважувань на терезах-шальках потрібно?","<b>2</b>. Кладемо 3 і 3: якщо рівновага — важка серед 2 решти (ще одне зважування 1 vs 1). Якщо ні — беремо важчу трійку, кладемо 1 vs 1: рівновага → третя."],
["Є відра на 3 л і 5 л. Як відміряти рівно 4 л?","Наповни 5 л → перелий у 3 л (у 5-літровому лишилось 2 л) → вилий 3 л → перелий 2 л у 3-літрове → наповни 5 л → долий 3-літрове (бракує 1 л) → у 5-літровому <b>4 л</b>."],
["Три вимикачі в коридорі, лампа в закритій кімнаті. Зайти можна лише раз. Як визначити, який вимикач від лампи?","Увімкни перший на кілька хвилин, вимкни, увімкни другий і заходь. Світить — другий; не світить, але тепла — перший; холодна — третій."],
["Скільки разів за добу годинна і хвилинна стрілки збігаються?","<b>22 рази</b> (а не 24): за 12 годин — 11 разів, бо між 11:00 і 13:00 збіг лише один (12:00)."],
["Продовж послідовність: 2, 6, 12, 20, 30, …","Різниці 4, 6, 8, 10 → наступна 12, тобто <b>42</b>. Або формула n·(n+1): 6·7 = 42."],
["Скільки настроювачів піаніно у Києві? (класична задача Фермі)","~3 млн жителів → ~1,2 млн домогосподарств; піаніно в ~2% → ~25 тис. + школи → ~30 тис. піаніно. Налаштування раз на рік, настроювач робить ~2 на день × 250 днів = 500 на рік → <b>~60 настроювачів</b>."],
["Скільки чашок кави випивають в Україні за день?","~25 млн дорослих; каву п'ють ~60%; в середньому ~1,5 чашки → 25 × 0,6 × 1,5 ≈ <b>22 млн чашок</b> на день. Важлива логіка, а не точне число."]
]},
{id:"excel", title:"Excel / Google Sheets", intro:"Базовий інструмент. Знай агрегатні функції, пошук (VLOOKUP/XLOOKUP), зведені таблиці та обробку помилок.", qs:[
["В чому різниця між Excel та Google Spreadsheets?","Excel — десктопна програма, потужніша для великих даних, Power Query, макроси VBA. Google Sheets — у браузері, зручна спільна робота в реальному часі, функції типу QUERY, IMPORTRANGE, але повільніша на великих обсягах."],
["Які агрегатні функції знаєш?","Ті, що з багатьох значень роблять одне: SUM, AVERAGE, COUNT, COUNTA, MIN, MAX, MEDIAN, а також умовні SUMIF(S), COUNTIF(S), AVERAGEIF(S)."],
["З якими функціями працюєш?","Назви реальні: SUM/AVERAGE, IF, SUMIFS/COUNTIFS, VLOOKUP/XLOOKUP, INDEX+MATCH, IFERROR, TEXT, LEFT/RIGHT/MID, TRIM, CONCAT, функції дат (TODAY, EOMONTH), UNIQUE, FILTER."],
["Що таке умовне форматування?","Автоматичне розфарбування клітинок за правилом (наприклад, червоним, якщо значення < 0). Допомагає одразу бачити аномалії, тренди, топ-значення."],
["Для чого VLOOKUP (XLOOKUP)?","Щоб знайти значення в іншій таблиці за ключем — як «підтягнути» дані. XLOOKUP — новіший: шукає в будь-якому напрямку, за замовчуванням точний збіг, має обробку «не знайдено».","Підтягнути ціну товару з довідника за його ID."],
["Що таке pivot table?","Зведена таблиця — швидко групує і агрегує дані без формул: перетягнув поля в рядки/стовпці/значення — отримав, наприклад, суму продажів по місяцях і регіонах."],
["Різниця між фільтруванням та сортуванням?","Сортування змінює порядок рядків (від більшого до меншого). Фільтрування ховає рядки, що не відповідають умові. Дані не видаляються в обох випадках."],
["Як знайти та видалити дублікати?","Знайти — умовне форматування «Повторювані значення» або COUNTIF > 1. Видалити — «Дані → Видалити дублікати» (Excel) / «Очищення даних → Видалити дублікати» (Sheets) або функція UNIQUE."],
["Коли використовується IFERROR і чому важлива?","Замінює помилку (#N/A, #DIV/0!) на зрозуміле значення. Звіт виглядає чисто, а підсумкові формули не ламаються.","<code>=IFERROR(VLOOKUP(A2;B:C;2;0);\"не знайдено\")</code>"],
["Як працює функція TTEST?","Виконує t-тест Стьюдента і повертає p-value — чи статистично відрізняються середні двох вибірок. Аргументи: два діапазони, кількість хвостів (1/2), тип тесту (парний, рівні/нерівні дисперсії)."],
["Коли використовується CONCAT?","Щоб склеїти текст з кількох клітинок в одну: ім'я + прізвище, створення ключа з кількох полів."],
["Результат =MAX(A1:A10)?","Найбільше число в діапазоні A1:A10."],
["Результат =SUMIF(A1:A10, \">50\")?","Сума тільки тих значень з A1:A10, що більші за 50."],
["Результат =IF(A1>10, \"Yes\", \"No\")?","«Yes», якщо A1 більше 10, інакше «No»."],
["Результат =VLOOKUP(A1, B1:C10, 2, FALSE)?","Шукає значення A1 у першому стовпці діапазону (B) з точним збігом і повертає значення з 2-го стовпця діапазону (C) у тому ж рядку. Не знайде — #N/A."],
["Результат =INDEX(A1:C10, 5, 2)?","Значення з 5-го рядка і 2-го стовпця діапазону, тобто клітинка B5."],
["Результат =LEFT(A1, 5)?","Перші 5 символів тексту з A1."],
["Результат =TRIM(A1)?","Текст з A1 без зайвих пробілів на початку/в кінці та подвійних пробілів усередині."],
["Результат =CONCATENATE(A1, \" \", B1)?","Склеює A1 і B1 через пробіл, наприклад «Іван Петренко»."],
["Як шукати дані, якщо не знаєш, де вони?","Ctrl+F (пошук по всьому аркушу/книзі), фільтри, функції MATCH/XLOOKUP, FILTER або умовне форматування для підсвічування."],
["Як розрахувати відсоток від загальної суми?","Ділиш значення на загальну суму з абсолютним посиланням і ставиш процентний формат.","<code>=B2/SUM($B$2:$B$100)</code>"],
["Приклади, коли аналітику потрібне умовне форматування?","Підсвітити падіння метрик, теплова карта когорт retention, відмітити викиди, прострочені дедлайни, топ-10 значень."],
["Як працює COUNTIF? Приклад.","Рахує кількість клітинок, що відповідають умові.","<code>=COUNTIF(C:C;\"Україна\")</code> — скільки рядків з країною Україна."],
["Як використовувати RANK?","Повертає місце числа серед інших (1 — найбільше за замовчуванням).","<code>=RANK(B2;$B$2:$B$50)</code> — місце менеджера за продажами."],
["Формули для обробки помилок? Приклад.","IFERROR (будь-яка помилка), IFNA (тільки #N/A), ISERROR/ISBLANK для перевірок, або запобігання: IF(B2=0;0;A2/B2).","<code>=IFERROR(A2/B2;0)</code>"]
]},
{id:"sql", title:"SQL", intro:"Топ-навичка для аналітика. Крім теорії, тренуйся писати запити: LeetCode, StrataScratch, HackerRank, Codewars.", qs:[
["Що таке SQL і для чого?","Мова запитів до реляційних баз даних. Аналітик ним дістає, фільтрує, об'єднує та агрегує дані."],
["У якому середовищі використовував SQL?","Назви реальне: PostgreSQL, MySQL, BigQuery, ClickHouse, DBeaver, тренажери (StrataScratch, LeetCode)."],
["Твої слабкі сторони в SQL?","Чесно, але з планом: «Віконні функції ще пишу повільно, тому щотижня розв'язую задачі на StrataScratch»."],
["Чи може аналітик обійтися без SQL?","Рідко. Майже всі дані лежать у БД; без SQL ти залежиш від інших людей чи готових вивантажень."],
["Порядок написання: FROM, LIMIT, GROUP BY, SELECT, ORDER BY, WHERE","SELECT → FROM → WHERE → GROUP BY → (HAVING) → ORDER BY → LIMIT."],
["Порядок виконання цих команд","FROM → WHERE → GROUP BY → (HAVING) → SELECT → ORDER BY → LIMIT. Тому аліас із SELECT не можна використати у WHERE."],
["Що робить GROUP BY? Про що пам'ятати в SELECT?","Групує рядки за значеннями колонок, щоб порахувати агрегати для кожної групи. У SELECT можуть бути тільки колонки з GROUP BY або агрегатні функції.","<code>SELECT country, SUM(revenue) FROM sales GROUP BY country</code>"],
["Різниця між WHERE та HAVING?","WHERE фільтрує рядки ДО групування, HAVING — групи ПІСЛЯ (тут можна використовувати агрегати).","<code>... GROUP BY country HAVING SUM(revenue) > 1000</code>"],
["Що таке агрегатні функції? Які знаєш?","Функції, що з багатьох рядків повертають одне значення: COUNT, SUM, AVG, MIN, MAX (а також STDDEV, VARIANCE у багатьох СУБД)."],
["Без чого не може працювати агрегатна функція у запиті?","Без набору рядків (FROM). Якщо в SELECT є і звичайні колонки, і агрегат — потрібен GROUP BY за цими колонками."],
["Як знайти стандартне відхилення в SQL?","Функція STDDEV / STDDEV_SAMP (для вибірки) чи STDDEV_POP (для популяції).","<code>SELECT STDDEV_SAMP(price) FROM orders</code>"],
["Як працює CASE? Коли використовувати?","Це «IF» у SQL: повертає різні значення залежно від умов. Для категоризації, сегментів, умовних агрегатів.","<code>CASE WHEN age < 18 THEN 'teen' ELSE 'adult' END</code>"],
["Навіщо BETWEEN? Приклад.","Перевірка, чи значення в діапазоні, включно з межами.","<code>WHERE order_date BETWEEN '2024-01-01' AND '2024-01-31'</code>"],
["Як сортувати результат?","ORDER BY колонка ASC (за зростанням, за замовчуванням) або DESC (за спаданням). Можна кілька колонок."],
["Які види JOIN знаєш? Різниця?","INNER — тільки збіги в обох таблицях. LEFT — усі з лівої + збіги з правої (інакше NULL). RIGHT — навпаки. FULL — усі рядки з обох. CROSS — кожен з кожним."],
["Різниця між JOIN та UNION?","JOIN додає колонки (з'єднує таблиці «вбік» за ключем). UNION додає рядки (ставить результати один під одним; колонки мають збігатися за кількістю і типом)."],
["Для чого SELF JOIN?","Об'єднати таблицю саму з собою — коли рядки пов'язані між собою.","Співробітник і його менеджер у тій самій таблиці employees."],
["Різниця між UNION та UNION ALL?","UNION видаляє дублікати (повільніше), UNION ALL залишає всі рядки (швидше). Якщо дублікатів не буде або вони потрібні — UNION ALL."],
["Що таке віконні функції?","Рахують значення по «вікну» рядків, не схлопуючи їх, як GROUP BY. Для рангів, накопичувальних сум, порівняння з попереднім рядком.","<code>ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY date)</code>, <code>SUM(x) OVER (ORDER BY date)</code>, LAG/LEAD."],
["Як швидко прибрати дублікати?","SELECT DISTINCT, GROUP BY за всіма колонками, або ROW_NUMBER() OVER (PARTITION BY ...) і залишити rn = 1."],
["Як перетворити числа з тексту в число?","CAST(col AS INTEGER/NUMERIC) або col::numeric (PostgreSQL). Перед цим можна прибрати пробіли/коми через TRIM/REPLACE."],
["Як вивести топ-10 країн за доходом?","Сортування за спаданням + LIMIT.","<code>SELECT country, SUM(revenue) r FROM t GROUP BY country ORDER BY r DESC LIMIT 10</code>"],
["Що таке NULL? Як позбутися?","NULL — відсутність значення (не 0 і не порожній рядок). Відфільтрувати: WHERE col IS NOT NULL; замінити: COALESCE(col, 0)."],
["Для чого LIKE?","Пошук за шаблоном у тексті.","<code>WHERE email LIKE '%@gmail.com'</code>"],
["Різниця між TABLE та VIEW?","TABLE фізично зберігає дані. VIEW — збережений запит («віртуальна таблиця»), дані рахуються при зверненні."],
["Навіщо AND, OR, NOT?","Логічні оператори для комбінування умов: AND — обидві правдиві, OR — хоча б одна, NOT — заперечення."],
["Які wildcard-символи знаєш?","% — будь-яка кількість будь-яких символів; _ — рівно один символ. (У SQL Server ще [abc] — набір символів.)"],
["Оператор IN — приклад і перевага","Перевіряє, чи значення в списку. Коротше і зрозуміліше за багато OR; можна передати підзапит.","<code>WHERE country IN ('UA','PL','DE')</code>"],
["Навіщо AS?","Дає аліас (псевдонім) колонці або таблиці — для читабельності.","<code>SELECT SUM(revenue) AS total FROM orders AS o</code>"],
["Які SQL-оператори знаєш?","Арифметичні (+ − * / %), порівняння (=, <>, >, <), логічні (AND, OR, NOT), IN, BETWEEN, LIKE, IS NULL, EXISTS."],
["Навіщо коментарі в SQL?","Пояснити логіку складного запиту собі і колегам, тимчасово «вимкнути» частину коду."],
["Які види коментарів знаєш?","Однорядковий: <code>-- текст</code>. Багаторядковий: <code>/* текст */</code>."],
["Як захиститися від NULL у розрахунках?","COALESCE(col, 0) або CASE WHEN col IS NULL THEN 0 ELSE col END. Бо будь-яка арифметика з NULL дає NULL."],
["Як захиститися від ділення на нуль?","NULLIF у знаменнику — тоді результат буде NULL замість помилки.","<code>revenue / NULLIF(users, 0)</code>"],
["Навіщо оптимізація запиту?","Щоб запит працював швидше і дешевше (у хмарних БД платиш за обсяг). Приклади: вибирати лише потрібні колонки замість SELECT *, раніше фільтрувати, використовувати індекси/партиції."],
["Що таке ETL?","Extract — дістати дані з джерел, Transform — очистити і перетворити, Load — завантажити у сховище. Так готують дані для аналітики (Airflow, dbt тощо)."],
["Що таке індекси?","Структура, що пришвидшує пошук рядків (як зміст у книзі). Пришвидшує читання, але сповільнює запис і займає місце."],
["Який запит виведе кількість унікальних клієнтів?","Правильно <b>c)</b> <code>SELECT COUNT(DISTINCT CustomerID) FROM Customers;</code>. a) рахує всі рядки, b) DISTINCT застосується до одного числа, d) синтаксична помилка."]
]},
{id:"bi", title:"BI-системи (Power BI, Tableau)", intro:"Власні дашборди — найкращий аргумент: розмова піде про твою роботу, а не про теорію.", qs:[
["Які BI-системи використовуєш?","Назви реальні (Power BI, Tableau, Looker Studio, Metabase) і для чого: дашборди продажів, моніторинг метрик продукту."],
["Чи маєш власні дашборди?","Розкажи: яке питання бізнесу вирішує дашборд, джерела даних, ключові метрики, візуалізації, які інсайти знайшов. Май посилання напоготові."],
["Що таке Power Query?","Інструмент Excel/Power BI для завантаження та підготовки даних (ETL без коду): підключення до джерел, очищення, трансформації, які можна повторювати автоматично."],
["Чим Power Query відрізняється від обробки в Excel?","У Power Query кроки записуються і повторюються автоматично при оновленні даних; оригінал не змінюється; краще для великих обсягів. В Excel обробка ручна і її треба повторювати."],
["Які джерела даних підтримує Power Query?","Excel, CSV, TXT, папки з файлами, бази даних (SQL Server, PostgreSQL, MySQL), веб-сторінки, API, SharePoint, Google BigQuery та інші."],
["Як очистити дані в Power Query?","Видалити зайві колонки/рядки, прибрати дублікати й порожні значення, Trim/Clean, змінити типи, розділити колонки, замінити значення, відфільтрувати."],
["Як працювати з типами даних у Power Query?","Біля назви колонки іконка типу — клікаєш і вибираєш (Text, Whole Number, Date…). Power Query сам визначає типи, але це треба перевіряти. Помилки конвертації видно як Error."],
["Як знайти та видалити дублікати в Power Query?","Виділити колонку(и) → Home → Remove Rows → Remove Duplicates. Знайти: Keep Rows → Keep Duplicates."],
["Як перейменувати стовпець?","Подвійний клік на заголовку або правий клік → Rename."],
["Для чого поле «Applied steps»?","Показує всю історію трансформацій. Можна повернутися до кроку, змінити чи видалити його — процес прозорий і відтворюваний."],
["Для чого «Split Column»?","Розділити колонку на кілька за роздільником або кількістю символів.","«Іван Петренко» → «Іван» і «Петренко»."],
["Як видалити пусті значення?","Фільтр колонки → зняти (null)/(blank), або Home → Remove Rows → Remove Blank Rows."],
["Як об'єднати дані в Power Query?","Merge Queries — як JOIN (додає колонки за ключем). Append Queries — як UNION (додає рядки)."],
["Що таке DAX?","Мова формул Power BI для розрахункових мір і колонок.","<code>Total Sales = SUM(Sales[Amount])</code>, CALCULATE, FILTER."],
["Різниця worksheet та dashboard у Tableau?","Worksheet — одна візуалізація. Dashboard — полотно, що збирає кілька worksheets разом з фільтрами та інтерактивом."],
["Різниця measure та dimension у Tableau?","Dimension — якісні дані, за якими групуємо (країна, дата, категорія). Measure — числові дані, які агрегуємо (виручка, кількість)."],
["Що таке calculated field?","Нове поле, створене формулою з наявних.","Profit Ratio = SUM([Profit]) / SUM([Sales])."],
["Різниця discrete та continuous полів?","Discrete (синій) — окремі значення, створюють заголовки/категорії. Continuous (зелений) — неперервна шкала, створюють вісь."],
["Що таке parameters у Tableau?","Змінна, яку користувач змінює сам (число, дата, список) — для інтерактиву: вибрати метрику, поріг, топ-N."],
["Як створити calculated field з умовами?","Через IF/CASE.","<code>IF [Sales] > 1000 THEN \"High\" ELSE \"Low\" END</code>"],
["Без чого неможливо створити карту в Tableau?","Без географічних даних: поле з геороллю (країна, місто, поштовий індекс) або широта/довгота."],
["Для чого групи в Tableau?","Об'єднати кілька значень dimension в одну категорію.","Об'єднати країни в регіони «Європа», «Азія»."]
]},
{id:"stats", title:"Статистика", intro:"Рекомендована книга: «Practical Statistics for Data Scientists».", qs:[
["Що таке середнє арифметичне?","Сума всіх значень, поділена на їхню кількість.","(2+4+9)/3 = 5."],
["Що таке медіана? Чим відрізняється від середнього?","Значення посередині відсортованого ряду. Середнє «тягнуть» великі значення, медіану — ні.","Зарплати 10, 12, 15, 100: середнє 34,25, медіана 13,5."],
["Перевага медіани над середнім?","Стійка до викидів — краще описує «типове» значення при перекошених даних (доходи, ціни на житло)."],
["Що таке мода?","Значення, що трапляється найчастіше.","1, 2, 2, 3, 5 → мода 2."],
["Що таке квартилі?","Значення, що ділять відсортовані дані на 4 рівні частини: Q1 (25%), Q2 (50%, медіана), Q3 (75%)."],
["Яким квартилем є медіана?","Другим (Q2)."],
["Що таке квантиль?","Значення, нижче якого лежить певна частка даних. Квантиль 0,9 — 90% значень менші.","«90% сторінок завантажуються швидше, ніж за 2 с»."],
["Що означає 99-й процентиль?","Значення, нижче якого 99% спостережень. Часто для часу відповіді сервера або пошуку аномалій."],
["Що таке інтерквартильний розмах (IQR)?","IQR = Q3 − Q1 — розкид середніх 50% даних."],
["Як прибрати викиди з IQR?","Викид — усе, що нижче Q1 − 1,5·IQR або вище Q3 + 1,5·IQR."],
["Що таке викид?","Значення, яке сильно відрізняється від решти даних (помилка, рідкісна подія або важливий сигнал)."],
["Бачиш викид у даних. Що робитимеш?","Спершу зрозумію причину: помилка даних (виправити/видалити), справжня рідкісна подія (залишити, використовувати медіану, аналізувати окремо). Не видаляти бездумно."],
["Які 5 параметрів показує boxplot?","Мінімум, Q1, медіана, Q3, максимум (вуса зазвичай до 1,5·IQR, точки за ними — викиди)."],
["Що таке нормальний розподіл?","Симетричний «дзвін» навколо середнього; середнє = медіана = мода; описується середнім і стандартним відхиленням."],
["Що таке центральна гранична теорема?","Середні великої кількості вибірок розподілені приблизно нормально, навіть якщо самі дані — ні. Тому працюють t-тести і довірчі інтервали."],
["Правило трьох сигм?","У нормальному розподілі ~68% даних у межах ±1σ, ~95% — ±2σ, ~99,7% — ±3σ. Значення за 3σ — кандидати у викиди."],
["Як виглядає графік нормального розподілу?","Симетрична дзвоноподібна крива з піком у середньому, «хвости» плавно спадають в обидва боки."],
["Що таке стандартне відхилення?","Середній розкид значень навколо середнього (корінь з дисперсії). Мале — дані щільні, велике — розкидані."],
["Що таке біноміальний розподіл?","Кількість «успіхів» у n незалежних спробах з однаковою ймовірністю p.","Скільки з 100 користувачів купить, якщо конверсія 5%."],
["Усім студентам дали +2500 грн. Як зміняться середнє і медіана?","Обидва зростуть на 2500 грн."],
["Усім студентам дали +2500 грн. Як зміняться std та IQR?","Не зміняться — зсув на константу не змінює розкид."],
["Доходи зросли на 7%. Середнє і медіана?","Обидва зростуть на 7% (помножаться на 1,07)."],
["Доходи зросли на 7%. std та IQR?","Обидва зростуть на 7% — множення масштабує і розкид."],
["Популяція і вибірка?","Популяція — всі об'єкти, що нас цікавлять (усі користувачі). Вибірка — частина, яку ми реально досліджуємо. По вибірці робимо висновки про популяцію."],
["Що таке зміщена вибірка?","Вибірка не репрезентує популяцію.","Опитування про задоволеність лише серед тих, хто сам залишив відгук."],
["Регресія до середнього?","Після екстремального результату наступний зазвичай ближчий до середнього.","Найгірший тиждень продажів після «покращення» — частина росту буде просто поверненням до норми."],
["Ідея бутстрапу?","Багато разів робимо вибірки з повторенням із наших даних і рахуємо статистику — так оцінюємо її розкид і довірчий інтервал без припущень про розподіл."],
["Коефіцієнт кореляції? Межі?","Міра лінійного зв'язку двох змінних, від −1 до 1."],
["Яка буває кореляція?","Позитивна (росте одне — росте інше), негативна (росте одне — падає інше), нульова. Також слабка/сильна; лінійна (Пірсон) та рангова (Спірмен)."],
["Про що говорить відсутність кореляції?","Немає ЛІНІЙНОГО зв'язку. Нелінійний (наприклад, U-подібний) може бути."],
["Що таке кореляційна матриця?","Таблиця коефіцієнтів кореляції між усіма парами змінних — швидко бачиш, що з чим пов'язане."],
["Кореляція vs каузальність?","Кореляція — змінні рухаються разом. Каузальність — одна спричиняє іншу. Кореляція не доводить причину (може бути третій фактор)."],
["Приклад кореляції без причинного зв'язку?","Продажі морозива і кількість утоплень корелюють — причина обох спека."],
["Що таке довірчий інтервал?","Діапазон, у якому з певною впевненістю (наприклад, 95%) лежить справжнє значення параметра. Показує точність оцінки."],
["Парадокс Сімпсона?","Тренд у кожній групі окремо зникає або перевертається при об'єднанні груп. Може підвести, якщо не дивитися на сегменти.","Конверсія вища в обох країнах для варіанта B, але загалом вища в A через різний розподіл трафіку."],
["Що показує R²?","Частку варіації цільової змінної, яку пояснює модель (0–1). R² = 0,8 — модель пояснює 80% мінливості."],
["Що таке екстраполяція?","Прогноз за межами діапазону наявних даних. Ризиковано, бо тренд може змінитися."],
["Лінійна vs логістична регресія?","Лінійна прогнозує число (виручку). Логістична — ймовірність класу (купить/не купить)."],
["Які ще регресії для прогнозу чисел?","Поліноміальна, Ridge/Lasso, дерева рішень і Random Forest, градієнтний бустинг (XGBoost), для часових рядів — ARIMA, Prophet."],
["Що таке точність (accuracy/precision) у класифікації?","Accuracy — частка всіх правильних прогнозів. Precision — серед передбачених «так» скільки справді «так»."],
["Що таке confusion matrix?","Таблиця 2×2: TP, FP, FN, TN — правильні й помилкові прогнози по кожному класу.","Спам-фільтр: TP — спам визнано спамом, FP — нормальний лист у спамі."]
]},
{id:"prob", title:"Теорія ймовірностей і комбінаторика", intro:"Формули: перестановки n!, сполучення C(n,k) = n! / (k!·(n−k)!).", qs:[
["Що таке умовна ймовірність?","Ймовірність події A за умови, що B вже сталася: P(A|B) = P(A і B) / P(B)."],
["Для чого теорема Байєса?","Оновити ймовірність гіпотези з урахуванням нових даних: P(A|B) = P(B|A)·P(A) / P(B).","Ймовірність хвороби при позитивному тесті."],
["Ймовірність рівно 5 орлів з 10 кидків?","C(10,5) / 2¹⁰ = 252 / 1024 ≈ 24,6%."],
["Задача Монті Голла","3 двері, за однією авто. Ти обрав одну, ведучий відкрив порожню з решти. Краще змінити вибір: шанс виграти 2/3 замість 1/3."],
["Незалежні та взаємовиключні події?","Незалежні — одна не впливає на іншу (два кидки монети). Взаємовиключні — не можуть статися разом (на кубику 1 і 6 в одному кидку)."],
["Ймовірність конкретного значення на кубику? На двох?","Один кубик: 1/6. Два кубики, конкретна пара (наприклад 6 і 6): 1/36. Сума 7: 6/36 = 1/6."],
["Скільки способів вибрати k з n?","Сполучення C(n,k) = n! / (k!·(n−k)!), якщо порядок не важливий."],
["Комітет з 4 з 10 людей?","C(10,4) = 210."],
["Скількома способами впорядкувати 5 книг?","5! = 120."],
["Вибрати 3 студентів з 8?","C(8,3) = 56."],
["Вибрати 5 друзів із 7?","C(7,5) = 21."],
["10 м'ячів: 7 червоних, 3 сині. Вибрати 2 різних кольорів?","7 × 3 = 21."],
["Впорядкувати 12 предметів?","12! = 479 001 600."],
["Команда з 11 з 20 кандидатів?","C(20,11) = 167 960."],
["Маршрути в квадраті 5×5 лише вниз/вправо?","Якщо 5×5 клітинок: 5 кроків вниз + 5 вправо = C(10,5) = 252. Якщо 5×5 точок: C(8,4) = 70. Уточни умову на співбесіді!"],
["Вибрати 2 голови та 3 заступників з 10?","C(10,2) × C(8,3) = 45 × 56 = 2520."]
]},
{id:"ab", title:"A/B-тести", intro:"Знай теорію, навіть якщо ще не запускав тести. Нижче — частотний (класичний) підхід.", qs:[
["Ідея A/B-тестів?","Випадково ділимо користувачів на групи: A бачить стару версію, B — нову. Порівнюємо метрику і статистично перевіряємо, чи різниця не випадкова."],
["Чи проводив A/B-тести?","Якщо ні — розкажи, як провів би, або про навчальний проєкт: гіпотеза, метрика, розмір вибірки, тривалість, висновок."],
["Чи є A/B-тест найкращим інструментом?","Це «золотий стандарт» для причинно-наслідкових висновків, але не завжди: потрібен трафік, час, можливість рандомізації. Іноді простіше якісне дослідження чи аналіз даних."],
["Альтернативи A/B-тесту?","Квазі-експерименти (difference-in-differences), до/після аналіз, causal impact, юзабіліті-тести, опитування, multi-armed bandits."],
["AA-тест і AAB-тест?","AA — обидві групи бачать однакове; перевіряємо, що система спліту працює і немає хибних різниць. AAB — дві контрольні + тестова: одночасно контроль якості та сам тест."],
["Коли A/B-тест недоцільний?","Малий трафік, дуже очевидні/обов'язкові зміни (баги, юридичні), великі редизайни з ефектом новизни, мережеві ефекти, етичні обмеження."],
["Базовий алгоритм A/B-тесту","Гіпотеза → цільова й guardrail-метрики → MDE, α, потужність → розмір вибірки і тривалість → рандомізація → запуск без підглядань → аналіз (стат. критерій) → рішення."],
["Нульова гіпотеза?","H₀: різниці між варіантами немає.","Конверсія A = конверсія B."],
["Альтернативна гіпотеза?","H₁: різниця є.","Нова кнопка змінює конверсію."],
["Що таке alpha?","Рівень значущості — допустима ймовірність помилки I роду. Зазвичай 0,05 (іноді 0,01 або 0,1)."],
["Що таке MDE?","Minimum Detectable Effect — найменший ефект, який тест здатен впевнено виявити. Залежить від розміру вибірки, α, потужності та дисперсії метрики."],
["Помилка першого роду?","Хибно знайти ефект, якого немає (false positive).","Впровадили «покращення», яке насправді нічого не дало."],
["Помилка другого роду?","Не помітити ефект, який є (false negative).","Відмовилися від корисної фічі."],
["За яку помилку відповідає потужність?","Потужність = 1 − β, де β — ймовірність помилки II роду. Зазвичай потужність 80%."],
["Як оцінити тривалість тесту?","Рахуємо необхідний розмір вибірки (з MDE, α, потужності) і ділимо на денний трафік у тест. Плюс мінімум 1–2 повні тижні через тижневу сезонність."],
["Що таке статзначущість?","Різниця настільки велика, що малоймовірно отримати її випадково при H₀ (p-value < α)."],
["Що таке p-value?","Ймовірність отримати такий або сильніший результат, якщо насправді ефекту немає. p = 0,03 — при відсутності ефекту такі дані бачили б лише в 3% випадків."],
["(1 − p-value) = 0,94. Що робитимеш?","p = 0,06 > 0,05 — результат не значущий. Не «дотягувати», не продовжувати тест довільно. Відхилити не можемо; можна перепланувати тест з більшою вибіркою."],
["Ризики підглядання за тестом?","Peeking: якщо зупинити тест, щойно p < 0,05, різко зростає шанс хибного висновку. Тест треба вести до запланованого розміру вибірки (або використовувати послідовні методи)."],
["Які стат. критерії знаєш?","Z-тест для пропорцій (конверсії), t-тест (середні — чек, час), Манна-Уітні (непараметричний), хі-квадрат, бутстрап. Вибір залежить від типу метрики та розподілу."],
["Конверсія 5%, очікуємо 5,5%. Скільки користувачів на варіант?","При α = 0,05 і потужності 80%: n ≈ 16·p(1−p)/δ² ≈ 16·0,0475 / 0,005² ≈ ~31 тис. на кожен варіант."],
["1000 користувачів: 60 конверсій у старому, 75 — у новому. Висновок?","6% vs 7,5%. Z-тест: z ≈ 1,34, p ≈ 0,18 > 0,05 — різниця не значуща. Новий дизайн на цій підставі не впроваджуємо; потрібна більша вибірка."],
["Тест з підвищенням ціни підписки на 20%. Як аналізувати?","Ключова метрика — виручка на користувача (ARPU/LTV), а не конверсія (вона, ймовірно, впаде). Guardrail — churn, повернення коштів. Дивитися довгостроково."],
["Більше двох варіантів у тесті — що змінюється?","Потрібна поправка на множинні порівняння (Бонферроні, Холм), більша вибірка, інколи ANOVA. Інакше росте шанс хибного «переможця»."],
["Чи можна запустити кілька тестів одночасно?","Так, якщо тести незалежні — рандомізація «перемішає» вплив. Якщо вони зачіпають одну частину продукту і можуть взаємодіяти — розділяти шари/аудиторію або запускати послідовно."],
["5 фіч для тесту. Яку першою?","Пріоритизація: очікуваний вплив × впевненість / зусилля (ICE, RICE). Плюс скільки трафіку і часу потрібно."],
["Що найголовніше в A/B-тесті?","Чітка гіпотеза і правильна метрика, коректна рандомізація, достатня вибірка й дисципліна (не підглядати)."],
["Чому важлива етика?","Тест впливає на реальних людей.","Тест маніпулятивних «темних патернів» підписки чи різних цін для вразливих груп."],
["Мінімальна тривалість тесту?","Зазвичай не менше 1 повного тижня (а краще 2), щоб врахувати тижневу сезонність, навіть якщо вибірку набрали раніше."],
["A/B-тест vs поступове викочування на всіх?","У A/B є контрольна група в той самий час — ефект відокремлюється від сезонності/маркетингу. При викочуванні на всіх порівнюємо «до/після», і будь-яка зовнішня подія спотворює висновок."],
["Що таке peeking problem і як уникнути?","Регулярно дивитися результати й зупиняти тест при першій значущості → завищені хибні позитиви. Уникати: заздалегідь фіксувати розмір вибірки/тривалість або використовувати sequential testing."]
]},
{id:"metrics", title:"Продуктові метрики", intro:"Розумій не тільки формули, а й що метрика говорить про бізнес.", qs:[
["Які продуктові метрики знаєш?","DAU/WAU/MAU, retention, churn, конверсія, LTV, ARPU, ARPPU, CAC, sticky factor, середній чек, тривалість сесії, NPS."],
["Що таке North Star метрика?","Головна метрика, що найкраще відображає цінність продукту для користувача і пов'язана з бізнесом.","Spotify — час прослуховування, Airbnb — заброньовані ночі."],
["Що таке DAU?","Daily Active Users — кількість унікальних користувачів, що зробили цільову дію за день."],
["З яких користувачів складається DAU?","Нові (сьогодні вперше), ті, що повернулися (утримані), і повернені після паузи (resurrected)."],
["Що означає «active» у DAU?","Визначає команда: зробив значущу дію (відкрив застосунок, переглянув контент, зробив покупку). Важливо, щоб це відображало реальну цінність."],
["Що таке конверсія?","Частка користувачів, що перейшли до цільової дії.","Із 1000, хто відкрив сторінку товару, 50 купили → конверсія 5%."],
["10 млн завантажень — чому це vanity-метрика?","Завантаження не означають використання чи гроші. Багато могли видалити одразу. Важливіше retention, активні користувачі, виручка."],
["Що таке LTV? За який період?","Lifetime Value — скільки грошей приносить користувач за весь час з продуктом. Часто рахують за горизонт (LTV 30/90/365 днів)."],
["Як рахується LTV і що на нього впливає?","Спрощено: ARPU × середній час життя (або ARPU / churn). Також: маржа, retention, ціна, частота покупок."],
["Що таке ARPU? Відмінність від LTV?","ARPU — середній дохід на користувача за період (місяць). LTV — за весь «життєвий цикл»."],
["ARPU vs ARPPU? Що більше?","ARPU — дохід на всіх користувачів, ARPPU — тільки на платних. ARPPU ≥ ARPU, бо ділимо на менше число."],
["Що таке CAC?","Customer Acquisition Cost — витрати на залучення одного клієнта (маркетинг / кількість нових клієнтів)."],
["Співвідношення LTV / CAC?","Показує, чи окуповується залучення. Здоровий орієнтир ~3:1."],
["LTV/CAC < 1, = 1, > 1?","< 1 — втрачаємо гроші на кожному клієнті. = 1 — у нуль (без урахування інших витрат). > 1 — заробляємо; чим вище, тим краще (але дуже високе — можливо, недоінвестуємо в ріст)."],
["Чому компанії з LTV/CAC = 3 потрібні інвестиції?","CAC платимо одразу, а LTV отримуємо роками. Щоб швидко рости, потрібні гроші «наперед» — касовий розрив."],
["Чи можна замість LTV використати ARPU?","Не зовсім: ARPU — за період і не враховує, як довго користувач залишається. Для рішень щодо маркетингу потрібен LTV."],
["Скільки чекати, щоб порахувати LTV кампанії?","Повністю — поки когорта «доживе». На практиці дивимося ранні точки (D7, D30) і прогнозуємо LTV за історичними кривими."],
["Що таке retention?","Частка користувачів, що повернулися через N днів після першого візиту.","Retention D7 = повернулися на 7-й день / усього в когорті."],
["Що таке churn? Як отримати з retention?","Частка користувачів, що пішли. Churn = 1 − retention (за той самий період)."],
["Rolling retention vs класичний?","Rolling — користувач вважається утриманим, якщо повернувся на N-й день АБО пізніше. Тому rolling ≥ класичного."],
["Що таке когорта?","Група користувачів зі спільною ознакою, зазвичай датою першого візиту. Когорти дозволяють порівнювати поведінку чесно, не змішуючи старих і нових."],
["Коефіцієнт прилипливості (sticky factor)?","DAU / MAU — як часто користувачі повертаються протягом місяця."],
["Межі sticky factor?","Від ~1/30 (кожен заходить раз на місяць) до 1 (усі щодня). Месенджери ~50%+."],
["Улюблений застосунок — за якими метриками стежити?","Обери застосунок і пов'яжи метрики з його цінністю: Duolingo — DAU, серії днів, retention, конверсія в Super."],
["ChatGPT — які метрики?","DAU/WAU, кількість діалогів/повідомлень на користувача, retention, конверсія в Plus, churn підписки, якість відповідей (лайки/дизлайки), latency."],
["«Дія» — які метрики?","Активні користувачі, частка успішно завершених послуг, час виконання послуги, помилки/відмови, задоволеність (CSAT), частка цифрових послуг замість офлайну."],
["Дашборд показав падіння конверсії. Де шукати причину?","1) Перевірити дані (трекінг, ETL, дашборд). 2) Сегментувати: платформа, країна, канал, версія. 3) Згадати релізи, зміни маркетингу, сезонність. 4) Знайти, на якому кроці воронки падіння."],
["Інстали +20%. Це успіх?","Не обов'язково. Треба перевірити якість трафіку: retention, активацію, виручку нових користувачів і CAC."],
["DAU −10%. Гіпотези?","Проблема трекінгу, баг у релізі, менше нових (зменшили рекламу), гірший retention, сезонність/свята, проблема в одній платформі чи країні, конкурент."],
["Активація триалу в підписку +10%. Прибуток зріс?","Не обов'язково: можливо, більше ранніх скасувань/повернень, змінився тариф або менше людей стартували триал. Дивимося на виручку і retention підписників."],
["Що таке воронка?","Послідовність кроків до цільової дії з конверсією між кроками. Показує, де ми втрачаємо користувачів.","Відвідування → кошик → оплата."],
["Як формуються гіпотези?","«Якщо зробимо X, то метрика Y зміниться на Z, тому що…». Джерела: дані, фідбек користувачів, конкуренти, UX-дослідження."],
["Як пріоритизувати гіпотези?","Фреймворки ICE (Impact, Confidence, Ease) або RICE (+ Reach). Оцінюєш і сортуєш."],
["Guardrail-метрики?","«Захисні» метрики, які не повинні погіршитися під час змін.","Підняли конверсію — перевіряємо, що не виріс churn чи час завантаження."],
["Що таке «дерево метрик»?","Розклад головної метрики на складові.","Виручка = користувачі × конверсія × середній чек. Допомагає знайти, що саме змінилось."]
]},
{id:"python", title:"Python (Pandas, NumPy)", intro:"Розберися в Pandas, NumPy, Matplotlib/Seaborn і зроби кілька аналітичних проєктів.", qs:[
["Що таке бібліотеки? Навіщо аналітику?","Набори готового коду, щоб не писати все з нуля: Pandas — таблиці, NumPy — обчислення, Matplotlib/Seaborn — графіки, SciPy — статистика."],
["Які бібліотеки використовуєш?","Pandas, NumPy, Matplotlib, Seaborn, Plotly, SciPy / statsmodels, scikit-learn."],
["У якому середовищі використовував Python?","Jupyter Notebook / Google Colab — зручно для аналізу покроково з графіками; VS Code / PyCharm — для скриптів."],
["Приклади аналізу на Python?","Опиши конкретно: EDA датасету, когортний аналіз retention, аналіз A/B-тесту, автоматизація звіту."],
["Чи маєш проєкти з Python?","Покажи GitHub/Kaggle: задача, дані, що зробив, висновки."],
["Бібліотеки для візуалізації і досвід?","Matplotlib (база), Seaborn (статистичні графіки), Plotly (інтерактив). Лінійні, бари, гістограми, boxplot, heatmap кореляцій."],
["EDA з Python: що робив?","<code>head()</code>, <code>info()</code>, <code>describe()</code>, <code>isnull().sum()</code>, <code>value_counts()</code>, <code>groupby()</code>, гістограми, boxplot, кореляції."],
["Як очищав дані від викидів?","IQR: залишити рядки між Q1 − 1,5·IQR і Q3 + 1,5·IQR, або z-score.","<code>q1,q3 = df.x.quantile([.25,.75]); iqr=q3-q1; df = df[df.x.between(q1-1.5*iqr, q3+1.5*iqr)]</code>"],
["Як імпортувати CSV і навіщо delimiter?","<code>pd.read_csv('file.csv', sep=';')</code>. Делімітер — символ-роздільник колонок (кома, крапка з комою, таб). Неправильний — усе в одній колонці."],
["Для чого info()?","Показує кількість рядків, назви колонок, типи даних, кількість ненульових значень і пам'ять."],
["Як вивести перші 10 рядків?","<code>df.head(10)</code>"],
["Як вивести лише другий стовпець?","<code>df.iloc[:, 1]</code> (за позицією) або <code>df['назва']</code>."],
["Як об'єднати два набори даних?","<code>pd.merge(df1, df2, on='id', how='left')</code> — як JOIN; <code>pd.concat([df1, df2])</code> — як UNION."],
["Для чого dropna()?","Видаляє рядки (або колонки при axis=1) з пропусками (NaN)."],
["Як видалити дублікати?","<code>df.drop_duplicates()</code> (можна вказати subset колонок)."],
["Для чого isnull().sum()?","Рахує кількість пропусків у кожній колонці."],
["Як відсортувати дані?","<code>df.sort_values('price', ascending=False)</code>"],
["Як змінити назву стовпця?","<code>df.rename(columns={'old': 'new'})</code>"],
["Як змінити тип даних?","<code>df['col'].astype(int)</code>, для чисел з помилками — <code>pd.to_numeric(..., errors='coerce')</code>."],
["Робота з датами та часом?","<code>pd.to_datetime()</code> для конвертації, <code>.dt.year/.dt.month/.dt.day_name()</code>, різниця дат, <code>resample()</code> для групування по днях/тижнях."],
["Для чого параметр axis?","axis=0 — по рядках (уздовж колонки, вниз), axis=1 — по колонках (уздовж рядка).","<code>df.drop('col', axis=1)</code> видаляє колонку."],
["Як видалити стовпець?","<code>df.drop(columns=['col'])</code>"],
["Для чого reset_index()?","Скидає індекс на 0, 1, 2… (старий стає колонкою; <code>drop=True</code> — видалити). Корисно після фільтрації чи groupby."],
["Як експортувати в CSV?","<code>df.to_csv('result.csv', index=False)</code>"],
["Поясни: df = pd.read_csv('housing_data.csv')","Читає CSV-файл у датафрейм Pandas і зберігає в змінну df."],
["Поясни: df['Price'].mean()","Середнє значення колонки Price."],
["Поясни: df['Title'] = df['Title'].str.strip()","Прибирає пробіли на початку й в кінці кожного значення колонки Title і перезаписує її."],
["Поясни: df['Genres'].value_counts()","Кількість кожного унікального значення в колонці Genres, від найчастішого."],
["Поясни: df['Date'] = pd.to_datetime(df['Date'])","Конвертує колонку Date з тексту в тип дати-часу, щоб можна було фільтрувати й рахувати з датами."]
]},
{id:"other", title:"Інші питання", intro:"Питання на мислення та рівень кандидата.", qs:[
["З яким найбільшим обсягом даних працював? Чим обробляв?","Назви чесно цифру і інструмент (наприклад, 2 млн рядків у Pandas, 100 ГБ у BigQuery) і як вирішував проблеми продуктивності."],
["Інший відділ не дає потрібні дані. Що робитимеш?","Поясню, навіщо дані і яку цінність дасть аналіз; дізнаюся причину відмови (доступи, безпека, зайнятість); запропоную компроміс; за потреби залучу менеджера."],
["Менеджер приймає рішення всупереч твоєму аналізу. Що робитимеш?","Ще раз коротко і зрозуміло покажу дані й ризики; вислухаю його аргументи (може, є контекст, якого я не знаю). Рішення за ним; запропоную метрики, щоб перевірити результат."],
["Дали код SQL/Python на доопрацювання. Алгоритм дій?","Зрозуміти мету коду → запустити, перевірити результат → розібрати логіку по частинах → уточнити незрозуміле в автора → внести зміни малими кроками → перевірити результат і задокументувати."],
["Продукт майже рік у софт-лончі, аналітики немає. Що замовиш першим?","Налаштувати трекінг ключових подій і воронки, базові метрики (DAU, retention, конверсія, виручка), атрибуцію джерел трафіку і простий дашборд."],
["Що для тебе продуктова аналітика?","Аналіз поведінки користувачів, щоб зрозуміти, як продукт створює цінність, і допомогти команді приймати рішення: що покращити, що тестувати."],
["Маркетингова vs продуктова аналітика?","Маркетингова — як залучити користувачів: канали, CAC, ROI кампаній. Продуктова — що відбувається після приходу: активація, retention, монетизація."],
["Задай задачу на логіку, яку інтерв'юер не розв'яже","Підготуй заздалегідь улюблену задачку. Головне — спокійно і з гумором, без бажання «завалити» людину."]
]}
];

const DATA_EN = [
{title:"Recruiter pre-screen", intro:"There are no right or wrong answers here. What matters: openness, specifics, saying «I» rather than «we», and showing you want to learn.", qs:[
["Why this field? Why did you choose analytics?","Tell a personal story: what hooked you (finding patterns, making fact-based decisions). Mention what you've already done: courses, pet projects.","«I saw a sales report change my team's decision and wanted to do that myself. I took an SQL course and built 2 dashboards.»"],
["What do you like most and least about your profession?","The plus — something meaningful (finding insights, impact on the product). The minus — honest but not critical for the job (e.g. messy data takes a lot of time — and what you do about it)."],
["Describe your ideal working day.","Show that you care about the work itself: a clear task, time for deep analysis, discussing results with the team, learning something new."],
["What matters most to you in a company: growth, benefits, salary, team, technology?","For a junior, a strong answer is growth and a team you can learn from. Be honest, but explain why."],
["What could make you quit?","Name things related to values: no development, toxicity, dishonesty. Don't say «I'll find somewhere that pays more»."],
["Have you faced conflicts at work? How were they resolved?","Use STAR: Situation → Task → Action → Result. Show that you look for solutions, not someone to blame."],
["Your lead is busy and you have no tasks or feedback in your first month. What do you do?","Take initiative: study documentation, data, dashboards, the product; ask colleagues; propose a task for yourself; write down questions and sync briefly with the lead when they have time."],
["What's the hardest change you've faced in your career?","Often it's the career switch into IT itself. Explain what was hard and how you coped."],
["Is there anyone in the profession who inspires you?","Name specific people, blogs, podcasts, book authors — it shows you're engaged with the field."],
["What inspires you? Tell us about your hobbies.","Be sincere. It's good if a hobby shows discipline or curiosity (sports, games with stats, reading)."]
]},
{title:"Logic & Fermi estimation", intro:"The Fermi method is a quick back-of-the-envelope estimate: break a big question into small ones you can approximate. The interviewer cares about your reasoning, not the exact number.", qs:[
["How many light bulbs are there in Kharkiv?","Break it down: population (~1.4M) → households (~600k) × bulbs per apartment (~10) = 6M. Add offices, shops, streets (+30–50%). Answer: around 8–10M. Say your assumptions out loud."],
["How many people are born in the world every day?","~8B people, birth rate ~17 per 1,000 per year → ~135M per year / 365 ≈ 370k per day."],
["How much sunflower oil do Ukrainian households consume per year?","~30M people × ~10 L per person per year ≈ 300M L (≈ 270k t). Explain every assumption."],
["A light turns on after 1 min, then 30 s, then 15 s… (each interval halves). How many times will it turn on in 2 minutes?","1 + 0.5 + 0.25 + … = 2 minutes — a sum of an infinite series. So within 2 minutes the light turns on an infinite number of times (any time shorter than 2 min gives a finite number)."],
["You have ropes that burn in 30 and 60 min, unevenly. How do you measure 45 min?","Light the 30-min rope at one end and the 60-min rope at one end at the same time. When the 30-min rope burns out (30 min passed), the long one has 30 min left — light its other end, it burns out in 15 min. Total 45."],
["Continue: 82, 50, 26, … / 1, 1, 2, 3, 5, … / 1, 8, 27, 64, …","82 = 9²+1, 50 = 7²+1, 26 = 5²+1 → next 3²+1 = <b>10</b>. Fibonacci: each = sum of the two previous → <b>8</b>. Cubes 1³, 2³, 3³, 4³ → <b>125</b>."],
["A bat and a ball cost $1.10 together. The bat costs $1 more than the ball. How much is the ball?","Not 0.10! If the ball is x, the bat is x + 1, together 2x + 1 = 1.10 → x = <b>$0.05</b>. Tests whether you answer on autopilot."],
["5 machines make 5 parts in 5 minutes. How long do 100 machines need to make 100 parts?","One machine makes one part in 5 min. So 100 machines make 100 parts in <b>5 minutes</b> too."],
["A lily pad doubles in size daily and covers the whole lake in 48 days. When does it cover half?","On <b>day 47</b> — because it doubles the next day. A question about exponential growth."],
["8 identical-looking balls, one is heavier. Minimum weighings on a balance scale?","<b>2</b>. Put 3 vs 3: if balanced — the heavy one is among the remaining 2 (one more weighing 1 vs 1). If not — take the heavier three, weigh 1 vs 1: balanced → it's the third."],
["You have 3 L and 5 L buckets. How do you measure exactly 4 L?","Fill 5 L → pour into 3 L (2 L left in the 5 L) → empty the 3 L → pour the 2 L into it → fill 5 L → top up the 3 L (needs 1 L) → <b>4 L</b> left in the 5 L bucket."],
["Three switches in the hall, a lamp in a closed room. You may enter once. How do you find which switch controls it?","Turn on the first for a few minutes, turn it off, turn on the second and go in. Lit — second; off but warm — first; cold — third."],
["How many times a day do the hour and minute hands overlap?","<b>22 times</b> (not 24): 11 times per 12 hours, since between 11:00 and 13:00 there's only one overlap (12:00)."],
["Continue the sequence: 2, 6, 12, 20, 30, …","Differences 4, 6, 8, 10 → next 12, so <b>42</b>. Or formula n·(n+1): 6·7 = 42."],
["How many piano tuners are there in Kyiv? (classic Fermi question)","~3M residents → ~1.2M households; ~2% have a piano → ~25k + schools → ~30k pianos. Tuned once a year; a tuner does ~2 per day × 250 days = 500 per year → <b>~60 tuners</b>."],
["How many cups of coffee are drunk in Ukraine per day?","~25M adults; ~60% drink coffee; ~1.5 cups on average → 25 × 0.6 × 1.5 ≈ <b>22M cups</b> a day. The logic matters, not the exact number."]
]},
{title:"Excel / Google Sheets", intro:"A core tool. Know aggregate functions, lookups (VLOOKUP/XLOOKUP), pivot tables and error handling.", qs:[
["What's the difference between Excel and Google Sheets?","Excel is a desktop app, more powerful for large data, Power Query, VBA macros. Google Sheets runs in the browser, great real-time collaboration, functions like QUERY, IMPORTRANGE, but slower on big data."],
["Which aggregate functions do you know?","Functions that turn many values into one: SUM, AVERAGE, COUNT, COUNTA, MIN, MAX, MEDIAN, plus conditional SUMIF(S), COUNTIF(S), AVERAGEIF(S)."],
["Which functions do you use?","Name real ones: SUM/AVERAGE, IF, SUMIFS/COUNTIFS, VLOOKUP/XLOOKUP, INDEX+MATCH, IFERROR, TEXT, LEFT/RIGHT/MID, TRIM, CONCAT, date functions (TODAY, EOMONTH), UNIQUE, FILTER."],
["What is conditional formatting?","Automatic cell coloring by a rule (e.g. red if value < 0). Helps you see anomalies, trends and top values instantly."],
["What is VLOOKUP (XLOOKUP) for?","To find a value in another table by key — «pull in» data. XLOOKUP is newer: searches in any direction, exact match by default, has «not found» handling.","Pull a product's price from a reference table by its ID."],
["What is a pivot table?","Groups and aggregates data quickly without formulas: drag fields into rows/columns/values and get, e.g., sales by month and region."],
["Filtering vs sorting?","Sorting changes row order (largest to smallest). Filtering hides rows that don't match a condition. Data isn't deleted in either case."],
["How do you find and remove duplicates?","Find — conditional formatting «Duplicate values» or COUNTIF > 1. Remove — «Data → Remove duplicates» (Excel) / «Data cleanup → Remove duplicates» (Sheets) or the UNIQUE function."],
["When is IFERROR used and why is it important?","Replaces an error (#N/A, #DIV/0!) with a readable value. The report looks clean and summary formulas don't break.","<code>=IFERROR(VLOOKUP(A2,B:C,2,0),\"not found\")</code>"],
["How does TTEST work?","Runs Student's t-test and returns the p-value — whether the means of two samples differ significantly. Arguments: two ranges, number of tails (1/2), test type (paired, equal/unequal variances)."],
["When is CONCAT used?","To join text from several cells into one: first + last name, building a key from several fields."],
["Result of =MAX(A1:A10)?","The largest number in A1:A10."],
["Result of =SUMIF(A1:A10, \">50\")?","The sum of only those values in A1:A10 that are greater than 50."],
["Result of =IF(A1>10, \"Yes\", \"No\")?","«Yes» if A1 is greater than 10, otherwise «No»."],
["Result of =VLOOKUP(A1, B1:C10, 2, FALSE)?","Looks up A1 in the first column of the range (B) with an exact match and returns the value from the 2nd column (C) in the same row. Not found — #N/A."],
["Result of =INDEX(A1:C10, 5, 2)?","The value from row 5, column 2 of the range — cell B5."],
["Result of =LEFT(A1, 5)?","The first 5 characters of the text in A1."],
["Result of =TRIM(A1)?","The text from A1 without leading/trailing spaces and double spaces inside."],
["Result of =CONCATENATE(A1, \" \", B1)?","Joins A1 and B1 with a space, e.g. «John Smith»."],
["How do you search for data if you don't know where it is?","Ctrl+F (search the whole sheet/workbook), filters, MATCH/XLOOKUP, FILTER, or conditional formatting to highlight matches."],
["How do you calculate a percentage of the total?","Divide the value by the total using an absolute reference and apply percent format.","<code>=B2/SUM($B$2:$B$100)</code>"],
["Examples of when an analyst needs conditional formatting?","Highlight metric drops, a retention cohort heatmap, mark outliers, overdue deadlines, top 10 values."],
["How does COUNTIF work? Example.","Counts cells that meet a condition.","<code>=COUNTIF(C:C,\"Ukraine\")</code> — how many rows have the country Ukraine."],
["How do you use RANK?","Returns a number's position among others (1 = largest by default).","<code>=RANK(B2,$B$2:$B$50)</code> — a salesperson's rank by sales."],
["Formulas for handling errors? Example.","IFERROR (any error), IFNA (only #N/A), ISERROR/ISBLANK for checks, or prevention: IF(B2=0,0,A2/B2).","<code>=IFERROR(A2/B2,0)</code>"]
]},
{title:"SQL", intro:"A top skill for an analyst. Besides theory, practice writing queries: LeetCode, StrataScratch, HackerRank, Codewars.", qs:[
["What is SQL and what is it used for?","A query language for relational databases. Analysts use it to retrieve, filter, join and aggregate data."],
["In which environment have you used SQL?","Name real ones: PostgreSQL, MySQL, BigQuery, ClickHouse, DBeaver, practice platforms (StrataScratch, LeetCode)."],
["Your weak spots in SQL?","Honest, but with a plan: «I'm still slow with window functions, so I solve StrataScratch tasks every week»."],
["Can a data analyst do without SQL?","Rarely. Almost all data lives in databases; without SQL you depend on other people or ready-made exports."],
["Writing order: FROM, LIMIT, GROUP BY, SELECT, ORDER BY, WHERE","SELECT → FROM → WHERE → GROUP BY → (HAVING) → ORDER BY → LIMIT."],
["Execution order of these clauses","FROM → WHERE → GROUP BY → (HAVING) → SELECT → ORDER BY → LIMIT. That's why a SELECT alias can't be used in WHERE."],
["What does GROUP BY do? What to remember in SELECT?","Groups rows by column values to compute aggregates per group. SELECT may only contain GROUP BY columns or aggregate functions.","<code>SELECT country, SUM(revenue) FROM sales GROUP BY country</code>"],
["WHERE vs HAVING?","WHERE filters rows BEFORE grouping, HAVING filters groups AFTER (aggregates allowed here).","<code>... GROUP BY country HAVING SUM(revenue) > 1000</code>"],
["What are aggregate functions? Which do you know?","Functions that return one value from many rows: COUNT, SUM, AVG, MIN, MAX (plus STDDEV, VARIANCE in many DBMSs)."],
["What can't an aggregate function work without?","Without a set of rows (FROM). If SELECT has both regular columns and an aggregate, you need GROUP BY on those columns."],
["How do you find standard deviation in SQL?","STDDEV / STDDEV_SAMP (sample) or STDDEV_POP (population).","<code>SELECT STDDEV_SAMP(price) FROM orders</code>"],
["How does CASE work? When to use it?","It's SQL's «IF»: returns different values depending on conditions. For categorization, segments, conditional aggregates.","<code>CASE WHEN age < 18 THEN 'teen' ELSE 'adult' END</code>"],
["Why use BETWEEN? Example.","Checks if a value is in a range, inclusive of bounds.","<code>WHERE order_date BETWEEN '2024-01-01' AND '2024-01-31'</code>"],
["How do you sort results?","ORDER BY column ASC (ascending, default) or DESC (descending). Several columns are allowed."],
["Which JOIN types do you know? Differences?","INNER — only matches in both tables. LEFT — all from the left + matches from the right (otherwise NULL). RIGHT — the reverse. FULL — all rows from both. CROSS — every row with every row."],
["JOIN vs UNION?","JOIN adds columns (joins tables «sideways» by key). UNION adds rows (stacks results; columns must match in count and type)."],
["What is a SELF JOIN for?","Joining a table to itself — when rows relate to each other.","An employee and their manager in the same employees table."],
["UNION vs UNION ALL?","UNION removes duplicates (slower), UNION ALL keeps all rows (faster). If there are no duplicates or you need them — UNION ALL."],
["What are window functions?","They compute values over a «window» of rows without collapsing them like GROUP BY. For ranks, running totals, comparing with the previous row.","<code>ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY date)</code>, <code>SUM(x) OVER (ORDER BY date)</code>, LAG/LEAD."],
["How do you quickly remove duplicates?","SELECT DISTINCT, GROUP BY all columns, or ROW_NUMBER() OVER (PARTITION BY ...) and keep rn = 1."],
["How do you convert numbers stored as text?","CAST(col AS INTEGER/NUMERIC) or col::numeric (PostgreSQL). Before that you may strip spaces/commas with TRIM/REPLACE."],
["How do you get the top 10 countries by revenue?","Sort descending + LIMIT.","<code>SELECT country, SUM(revenue) r FROM t GROUP BY country ORDER BY r DESC LIMIT 10</code>"],
["What is NULL? How do you get rid of it?","NULL is the absence of a value (not 0, not an empty string). Filter: WHERE col IS NOT NULL; replace: COALESCE(col, 0)."],
["What is LIKE for?","Pattern matching in text.","<code>WHERE email LIKE '%@gmail.com'</code>"],
["TABLE vs VIEW?","A TABLE physically stores data. A VIEW is a saved query («virtual table»), data is computed on access."],
["Why AND, OR, NOT?","Logical operators to combine conditions: AND — both true, OR — at least one, NOT — negation."],
["Which wildcard characters do you know?","% — any number of any characters; _ — exactly one character. (SQL Server also has [abc] — a character set.)"],
["IN operator — example and advantage","Checks if a value is in a list. Shorter and clearer than many ORs; accepts a subquery.","<code>WHERE country IN ('UA','PL','DE')</code>"],
["Why AS?","Gives an alias to a column or table — for readability.","<code>SELECT SUM(revenue) AS total FROM orders AS o</code>"],
["Which SQL operators do you know?","Arithmetic (+ − * / %), comparison (=, <>, >, <), logical (AND, OR, NOT), IN, BETWEEN, LIKE, IS NULL, EXISTS."],
["Why comments in SQL?","To explain complex query logic to yourself and colleagues, and to temporarily «switch off» part of the code."],
["Which comment types do you know?","Single-line: <code>-- text</code>. Multi-line: <code>/* text */</code>."],
["How do you protect calculations from NULL?","COALESCE(col, 0) or CASE WHEN col IS NULL THEN 0 ELSE col END. Any arithmetic with NULL gives NULL."],
["How do you protect against division by zero?","NULLIF in the denominator — the result becomes NULL instead of an error.","<code>revenue / NULLIF(users, 0)</code>"],
["Why optimize a query?","So it runs faster and cheaper (in cloud DBs you pay per data scanned). Examples: select only needed columns instead of SELECT *, filter early, use indexes/partitions."],
["What is ETL?","Extract — get data from sources, Transform — clean and reshape, Load — load into a warehouse. This is how data is prepared for analytics (Airflow, dbt, etc.)."],
["What are indexes?","A structure that speeds up row lookup (like a book's table of contents). Faster reads, but slower writes and extra storage."],
["Which query returns the number of unique customers?","Correct is <b>c)</b> <code>SELECT COUNT(DISTINCT CustomerID) FROM Customers;</code>. a) counts all rows, b) DISTINCT applies to a single number, d) syntax error."]
]},
{title:"BI tools (Power BI, Tableau)", intro:"Your own dashboards are the best argument: the conversation will be about your work, not theory.", qs:[
["Which BI tools do you use?","Name real ones (Power BI, Tableau, Looker Studio, Metabase) and for what: sales dashboards, product metric monitoring."],
["Do you have dashboards you built yourself?","Explain: which business question it answers, data sources, key metrics, visuals, what insights you found. Have the link ready."],
["What is Power Query?","An Excel/Power BI tool for loading and preparing data (no-code ETL): connecting to sources, cleaning, transformations that repeat automatically."],
["How is Power Query different from processing in Excel?","In Power Query steps are recorded and replayed automatically when data refreshes; the original isn't changed; better for large volumes. In Excel processing is manual and must be repeated."],
["Which data sources does Power Query support?","Excel, CSV, TXT, folders of files, databases (SQL Server, PostgreSQL, MySQL), web pages, APIs, SharePoint, Google BigQuery and more."],
["How do you clean data in Power Query?","Remove extra columns/rows, remove duplicates and blanks, Trim/Clean, change types, split columns, replace values, filter."],
["How do you work with data types in Power Query?","The type icon next to the column name — click and choose (Text, Whole Number, Date…). Power Query detects types itself, but you should verify. Conversion failures show as Error."],
["How do you find and remove duplicates in Power Query?","Select column(s) → Home → Remove Rows → Remove Duplicates. To find: Keep Rows → Keep Duplicates."],
["How do you rename a column?","Double-click the header or right-click → Rename."],
["What is the «Applied steps» pane for?","Shows the full history of transformations. You can go back to a step, edit or delete it — the process is transparent and reproducible."],
["What is «Split Column» for?","Splitting a column into several by a delimiter or number of characters.","«John Smith» → «John» and «Smith»."],
["How do you remove blank values?","Column filter → uncheck (null)/(blank), or Home → Remove Rows → Remove Blank Rows."],
["How do you combine data in Power Query?","Merge Queries — like JOIN (adds columns by key). Append Queries — like UNION (adds rows)."],
["What is DAX?","Power BI's formula language for calculated measures and columns.","<code>Total Sales = SUM(Sales[Amount])</code>, CALCULATE, FILTER."],
["Worksheet vs dashboard in Tableau?","A worksheet is a single visualization. A dashboard is a canvas combining several worksheets with filters and interactivity."],
["Measure vs dimension in Tableau?","Dimension — qualitative data you group by (country, date, category). Measure — numeric data you aggregate (revenue, count)."],
["What is a calculated field?","A new field created from existing ones with a formula.","Profit Ratio = SUM([Profit]) / SUM([Sales])."],
["Discrete vs continuous fields?","Discrete (blue) — separate values, create headers/categories. Continuous (green) — a continuous scale, creates an axis."],
["What are parameters in Tableau?","A variable the user changes (number, date, list) — for interactivity: choose a metric, a threshold, top-N."],
["How do you create a calculated field with conditions?","With IF/CASE.","<code>IF [Sales] > 1000 THEN \"High\" ELSE \"Low\" END</code>"],
["What is required to build a map in Tableau?","Geographic data: a field with a geographic role (country, city, postcode) or latitude/longitude."],
["What are groups in Tableau for?","Combining several dimension values into one category.","Grouping countries into «Europe», «Asia»."]
]},
{title:"Statistics", intro:"Recommended book: «Practical Statistics for Data Scientists».", qs:[
["What is the arithmetic mean?","The sum of all values divided by their count.","(2+4+9)/3 = 5."],
["What is the median? How does it differ from the mean?","The middle value of a sorted series. Large values «pull» the mean, but not the median.","Salaries 10, 12, 15, 100: mean 34.25, median 13.5."],
["Advantage of the median over the mean?","Robust to outliers — better describes the «typical» value in skewed data (incomes, house prices)."],
["What is the mode?","The most frequent value.","1, 2, 2, 3, 5 → mode is 2."],
["What are quartiles?","Values splitting sorted data into 4 equal parts: Q1 (25%), Q2 (50%, median), Q3 (75%)."],
["Which quartile is the median?","The second (Q2)."],
["What is a quantile?","The value below which a given share of data falls. The 0.9 quantile — 90% of values are lower.","«90% of pages load faster than 2 s»."],
["What does the 99th percentile mean?","The value below which 99% of observations fall. Often used for server response time or anomaly detection."],
["What is the interquartile range (IQR)?","IQR = Q3 − Q1 — the spread of the middle 50% of data."],
["How do you remove outliers with IQR?","An outlier is anything below Q1 − 1.5·IQR or above Q3 + 1.5·IQR."],
["What is an outlier?","A value very different from the rest of the data (an error, a rare event, or an important signal)."],
["You see an outlier in your data. What do you do?","First understand why: data error (fix/remove), genuine rare event (keep it, use the median, analyze separately). Don't remove blindly."],
["Which 5 parameters does a boxplot show?","Minimum, Q1, median, Q3, maximum (whiskers usually extend to 1.5·IQR, points beyond are outliers)."],
["What is the normal distribution?","A symmetric «bell» around the mean; mean = median = mode; described by mean and standard deviation."],
["What is the central limit theorem?","Means of many samples are approximately normally distributed, even if the data itself isn't. That's why t-tests and confidence intervals work."],
["The three-sigma rule?","In a normal distribution ~68% of data is within ±1σ, ~95% within ±2σ, ~99.7% within ±3σ. Values beyond 3σ are outlier candidates."],
["What does a normal distribution plot look like?","A symmetric bell-shaped curve peaking at the mean, tails decreasing smoothly on both sides."],
["What is standard deviation?","The average spread of values around the mean (square root of variance). Small — data is tight, large — spread out."],
["What is the binomial distribution?","The number of «successes» in n independent trials with the same probability p.","How many of 100 users buy if conversion is 5%."],
["Every student got +2,500 UAH. How do the mean and median change?","Both increase by 2,500 UAH."],
["Every student got +2,500 UAH. How do std and IQR change?","They don't — shifting by a constant doesn't change spread."],
["Incomes grew by 7%. Mean and median?","Both grow by 7% (multiplied by 1.07)."],
["Incomes grew by 7%. std and IQR?","Both grow by 7% — multiplication scales the spread too."],
["Population vs sample?","Population — all objects of interest (all users). Sample — the part we actually study. We draw conclusions about the population from the sample."],
["What is a biased sample?","A sample that doesn't represent the population.","A satisfaction survey only among people who left a review on their own."],
["Regression to the mean?","After an extreme result, the next one is usually closer to average.","After the worst sales week, part of the «improvement» is just a return to normal."],
["The idea of bootstrapping?","Repeatedly resample our data with replacement and compute the statistic — this estimates its spread and confidence interval without distribution assumptions."],
["Correlation coefficient? Range?","A measure of linear relationship between two variables, from −1 to 1."],
["What kinds of correlation are there?","Positive (one rises — the other rises), negative (one rises — the other falls), zero. Also weak/strong; linear (Pearson) and rank (Spearman)."],
["What does zero correlation tell you?","There's no LINEAR relationship. A non-linear one (e.g. U-shaped) may exist."],
["What is a correlation matrix?","A table of correlation coefficients between all pairs of variables — you quickly see what relates to what."],
["Correlation vs causation?","Correlation — variables move together. Causation — one causes the other. Correlation doesn't prove cause (there may be a third factor)."],
["Example of correlation without causation?","Ice cream sales and drownings correlate — the cause of both is hot weather."],
["What is a confidence interval?","A range that contains the true parameter value with a given confidence (e.g. 95%). Shows how precise the estimate is."],
["Simpson's paradox?","A trend in each group reverses or disappears when the groups are combined. It can mislead you if you don't look at segments.","Conversion is higher for B in both countries but higher for A overall because of different traffic mix."],
["What does R² show?","The share of the target variable's variance explained by the model (0–1). R² = 0.8 — the model explains 80% of variability."],
["What is extrapolation?","Predicting outside the range of available data. Risky, as the trend may change."],
["Linear vs logistic regression?","Linear predicts a number (revenue). Logistic predicts the probability of a class (buys / doesn't buy)."],
["Other regressions for numeric forecasts?","Polynomial, Ridge/Lasso, decision trees and Random Forest, gradient boosting (XGBoost), for time series — ARIMA, Prophet."],
["What is accuracy/precision in classification?","Accuracy — share of all correct predictions. Precision — of those predicted «yes», how many really are «yes»."],
["What is a confusion matrix?","A 2×2 table: TP, FP, FN, TN — correct and wrong predictions per class.","Spam filter: TP — spam marked as spam, FP — a normal email in spam."]
]},
{title:"Probability & combinatorics", intro:"Formulas: permutations n!, combinations C(n,k) = n! / (k!·(n−k)!).", qs:[
["What is conditional probability?","The probability of A given B has happened: P(A|B) = P(A and B) / P(B)."],
["What is Bayes' theorem for?","Updating a hypothesis' probability with new data: P(A|B) = P(B|A)·P(A) / P(B).","Probability of disease given a positive test."],
["Probability of exactly 5 heads in 10 flips?","C(10,5) / 2¹⁰ = 252 / 1024 ≈ 24.6%."],
["The Monty Hall problem","3 doors, a car behind one. You pick one, the host opens an empty one of the others. Switching is better: 2/3 chance to win instead of 1/3."],
["Independent vs mutually exclusive events?","Independent — one doesn't affect the other (two coin flips). Mutually exclusive — can't happen together (1 and 6 on one die roll)."],
["Probability of a specific value on one die? On two?","One die: 1/6. Two dice, a specific pair (e.g. 6 and 6): 1/36. Sum of 7: 6/36 = 1/6."],
["How many ways to choose k out of n?","Combinations C(n,k) = n! / (k!·(n−k)!), when order doesn't matter."],
["A committee of 4 from 10 people?","C(10,4) = 210."],
["How many ways to arrange 5 books?","5! = 120."],
["Choose 3 students out of 8?","C(8,3) = 56."],
["Choose 5 friends out of 7?","C(7,5) = 21."],
["10 balls: 7 red, 3 blue. Choose 2 of different colors?","7 × 3 = 21."],
["Arrange 12 items?","12! = 479,001,600."],
["A team of 11 from 20 candidates?","C(20,11) = 167,960."],
["Paths in a 5×5 grid moving only down/right?","If 5×5 cells: 5 down + 5 right = C(10,5) = 252. If 5×5 points: C(8,4) = 70. Clarify the setup in the interview!"],
["Choose 2 heads and 3 deputies from 10?","C(10,2) × C(8,3) = 45 × 56 = 2,520."]
]},
{title:"A/B tests", intro:"Know the theory even if you haven't run tests yet. Below is the frequentist (classical) approach.", qs:[
["The idea of A/B tests?","Randomly split users into groups: A sees the old version, B the new one. Compare a metric and statistically check that the difference isn't random."],
["Have you run A/B tests?","If not — explain how you would, or describe a study project: hypothesis, metric, sample size, duration, conclusion."],
["Is an A/B test the best tool?","It's the «gold standard» for causal conclusions, but not always: it needs traffic, time and the ability to randomize. Sometimes qualitative research or data analysis is simpler."],
["Alternatives to A/B tests?","Quasi-experiments (difference-in-differences), before/after analysis, causal impact, usability tests, surveys, multi-armed bandits."],
["AA test and AAB test?","AA — both groups see the same thing; checks that the split works and there are no false differences. AAB — two controls + a test: quality control and the test at once."],
["When is an A/B test not appropriate?","Low traffic, obvious/mandatory changes (bugs, legal), big redesigns with a novelty effect, network effects, ethical constraints."],
["Basic A/B test algorithm","Hypothesis → target & guardrail metrics → MDE, α, power → sample size and duration → randomization → run without peeking → analysis (stat test) → decision."],
["Null hypothesis?","H₀: there's no difference between variants.","Conversion A = conversion B."],
["Alternative hypothesis?","H₁: there is a difference.","The new button changes conversion."],
["What is alpha?","Significance level — the acceptable probability of a Type I error. Usually 0.05 (sometimes 0.01 or 0.1)."],
["What is MDE?","Minimum Detectable Effect — the smallest effect the test can reliably detect. Depends on sample size, α, power and metric variance."],
["Type I error?","Finding an effect that isn't there (false positive).","Shipping an «improvement» that actually did nothing."],
["Type II error?","Missing an effect that exists (false negative).","Dropping a useful feature."],
["Which error does power relate to?","Power = 1 − β, where β is the probability of a Type II error. Usually 80% power."],
["How do you estimate test duration?","Compute the required sample size (from MDE, α, power) and divide by daily traffic. Plus at least 1–2 full weeks due to weekly seasonality."],
["What is statistical significance?","The difference is large enough that getting it by chance under H₀ is unlikely (p-value < α)."],
["What is a p-value?","The probability of getting this or a stronger result if there's actually no effect. p = 0.03 — with no effect, such data would appear only in 3% of cases."],
["(1 − p-value) = 0.94. What do you do?","p = 0.06 > 0.05 — not significant. Don't «stretch» it or extend the test arbitrarily. We can't reject H₀; you can re-plan the test with a larger sample."],
["Risks of peeking at a running test?","Peeking: stopping as soon as p < 0.05 sharply raises the chance of a false conclusion. Run to the planned sample size (or use sequential methods)."],
["Which statistical tests do you know?","Z-test for proportions (conversion), t-test (means — order value, time), Mann-Whitney (non-parametric), chi-square, bootstrap. The choice depends on metric type and distribution."],
["Conversion 5%, expected 5.5%. Users per variant?","With α = 0.05 and 80% power: n ≈ 16·p(1−p)/δ² ≈ 16·0.0475 / 0.005² ≈ ~31k per variant."],
["1,000 users: 60 conversions in old, 75 in new. Conclusion?","6% vs 7.5%. Z-test: z ≈ 1.34, p ≈ 0.18 > 0.05 — not significant. We don't ship the new design on this basis; a larger sample is needed."],
["A test raising subscription price by 20%. How to analyze?","Key metric — revenue per user (ARPU/LTV), not conversion (it'll likely drop). Guardrails — churn, refunds. Look long-term."],
["More than two variants — what changes?","You need a multiple-comparison correction (Bonferroni, Holm), a bigger sample, sometimes ANOVA. Otherwise the chance of a false «winner» grows."],
